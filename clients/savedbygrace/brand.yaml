name: Saved by Grace Co. (SBG Co.)
colors:
  primary: ''
  secondary: ''
  background: '#FFFFFF'
typography:
  heading: Clean rounded sans-serif (unnamed; appears to be a modern geometric sans)
  body: Clean sans-serif with delicate feminine script accent for brand name lockup
visual_identity:
  aesthetic: Modern farmhouse meets a faith-based mommy blog. It's the aspirational
    but accessible aesthetic of a stylish, young Christian family living their best
    life in a beautifully curated, neutral-toned world.
  photography_style: 'Mixed: lifestyle shots that feel like high-quality user-generated
    content (UGC), combined with clean, minimalist studio flat lays for product.'
  design_language: Modern Farmhouse minimalist. It's clean and uncluttered, but values
    texture, warmth, and a 'hand-touched' feel over cold austerity.
  typography_feel: A friendly, rounded sans-serif paired with a delicate, feminine
    script accent. It feels like a mix of a clean digital font and a personal, handwritten
    sign-off.
  mascot_or_character: none
  visual_references:
  - The Magnolia / Joanna Gaines empire
  - The Instagram grid of a small-town boutique owner
  - Clean, text-based Christian apparel brands
  mood:
  - Wholesome
  - Aspirational
  - Comfortable
  - Sincere
  - Grounded
  notable_visual_signatures:
  - Short, centered, all-caps sans-serif phrases on garment-dyed t-shirts.
  - Using shiplap, pale wood, and neutral textiles as background textures.
  - Logo lockup combining a clean sans-serif with a single loopy, script element (e.g.,
    'co.').
  - Photography with warm, hazy, afternoon light and slightly desaturated tones.
  color_mood: Warm, muted earth tones and neutrals — oatmeal, washed-out denim, faded
    terracotta, and warm greys, like a sun-bleached photograph.
tone: Warm, direct, and unpretentious — the voice of a confident Christian mom who
  doesn't perform her faith or apologize for her humor. Lifestyle-first, faith-forward,
  witty without being crude.
audience:
  age_range: 25–45
  gender: Primarily female (women + moms as primary buyer; grandmothers as secondary
    gift buyer)
  interests:
  - Faith / Christianity (non-churchy expression)
  - Motherhood / parenting
  - American patriotism / 4th of July culture
  - Mom humor / relatable content
  - Boutique fashion / modern farmhouse aesthetic
  - Diet Coke / Dr. Pepper (lifestyle humor)
  - Kids fashion / mom-and-mini coordinating
  - Gifting (new baby, Mother's Day, Christmas)
