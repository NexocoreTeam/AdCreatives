sample_notes:
- total_reviews: 138
  bias_warnings:
  - "106 of 138 reviews are 5-star \u2014 extreme positive skew typical of review-gated\
    \ or follow-up email solicitation; the 3-star reviews are disproportionately high\
    \ signal and should be weighted accordingly"
  - "Multiple apparent duplicate reviews present (identical text, identical rating)\
    \ \u2014 actual unique reviewer count is lower than 138; patterns based on duplicates\
    \ should not be double-counted for confidence scoring"
  - "One 1-star review (scored as quality 1) was paradoxically written as a positive\
    \ review \u2014 'Great quality and sizing is accurate. Excellent customer service.'\
    \ This suggests possible misrating or platform error; treat as anomalous"
  - Review set skews toward satisfied buyers who felt moved to write; frustrated customers
    who silently churned or did not reorder are underrepresented
  - "Hat-specific pain points cluster distinctly from apparel reviews \u2014 hats\
    \ may represent a separate product quality tier or manufacturing source that should\
    \ be evaluated independently"
  - "No competitor brand names mentioned anywhere in the review set \u2014 alternatives\
    \ considered section is largely inferred, not directly evidenced"
  recency: "Specific dates not provided in the review data; recency cannot be confirmed\
    \ \u2014 treat all insights as directional until timestamped data is available"
- total_reviews: 201
  bias_warnings:
  - "CRITICAL \u2014 Dataset contamination: The overwhelming majority of these comments\
    \ are unrelated to faith-based apparel. They appear to be scraped from TikTok\
    \ or Instagram comment sections across multiple unrelated videos (BBQ restaurants\
    \ in South Carolina, baby clothing brands, Indonesian beauty products, a pants\
    \ try-on video). Only approximately 15-20 comments plausibly relate to apparel\
    \ in general; fewer than 10 can be confirmed as faith-based apparel adjacent."
  - "No star ratings exist \u2014 all reviews are listed as N/A. This eliminates a\
    \ standard quality signal and collapses the distribution toward emoji/low-effort\
    \ comments."
  - 'Social media comment bias: these are TikTok/Instagram comments, not structured
    reviews. This format skews heavily toward reactive, impulse-language responses
    and away from considered, descriptive feedback. Power of this data is in linguistic
    register and micro-trigger moments, NOT in frequency-based pattern analysis.'
  - 'Zero post-purchase transformation data: no commenter describes life after using
    a faith-based apparel product. All sentiment is pre-purchase or at-discovery stage.
    This dataset cannot inform retention, repeat purchase, or satisfaction messaging.'
  - 'Sample size for faith-based apparel specifically: fewer than 15 usable data points.
    Per the customer-research framework minimum viable sample threshold (5-10 per
    segment), this is insufficient to build personas, confirm JTBD, or draw messaging
    conclusions. All confidence scores are LOW as a result.'
  - Restaurant review contamination (Simply Southern BBQ and competitors) accounts
    for roughly 40% of all non-emoji comments. These have been excluded entirely from
    analysis.
  - Indonesian-language comments (likely a fragrance or skincare product) account
    for a small segment and have been excluded.
  recency: "Not determinable \u2014 no timestamps provided. Comment style suggests\
    \ contemporary social media (TikTok/Instagram Reels era), likely 2022-2024, but\
    \ cannot be confirmed."
  recommendation: This dataset is not suitable for VOC analysis of faith-based apparel
    without significant additional data. Recommend supplementing with (1) G2/Etsy/Shopify
    product reviews filtered to faith-based apparel SKUs, (2) Reddit communities such
    as r/Christian or faith lifestyle subs, (3) dedicated TikTok comment pulls from
    confirmed faith-apparel brand videos only, and (4) a minimum of 50 on-topic reviews
    before drawing any strategic conclusions.
- total_reviews: 130
  bias_warnings:
  - "These are YouTube comment section responses, not verified product reviews \u2014\
    \ they reflect audience engagement with a content creator, not direct post-purchase\
    \ product feedback. Treat as top-of-funnel sentiment, not conversion-stage VOC."
  - "Comments skew young (Gen Z / younger Millennial), likely 13\u201325 demographic.\
    \ Insights may not generalize to older faith-based apparel buyers."
  - "Many comments are giveaway entries (include sizes, Instagram handles, item requests)\
    \ \u2014 purchase intent signals are present but mediated by the incentive structure\
    \ of the giveaway."
  - "Significant comment pollution \u2014 roughly 40% of comments are off-topic (food\
    \ reviews, greetings, unrelated content), which compressed usable signal severely."
  - No verified purchasers in this set. Desires and language patterns are real, but
    no post-purchase transformation data exists. Would need G2/app store/actual product
    reviews to validate.
  - "Positive sentiment bias is extreme \u2014 comment sections on faith-creator content\
    \ self-select for supportive, same-faith viewers. Skeptics and critics are largely\
    \ absent."
  - Sample is too small and too homogeneous (Christian youth, US-skewing) to draw
    conclusions about the broader faith-based apparel market without additional research.
  - Minimum viable threshold for high-confidence insights (5+ independent data points
    per theme) is met only for brand discovery gap, faith-as-style, and Simply Southern
    brand affinity themes.
  recency: Specific dates not visible in the provided data. Comments reference COVID-era
    experiences and current Gen-Z slang patterns, suggesting approximate window of
    2021-2024, with no clear way to weight by recency.
