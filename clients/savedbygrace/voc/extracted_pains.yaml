language_patterns:
- "Highly casual, warm, and enthusiastic \u2014 heavy use of exclamation points and\
  \ affectionate diminutives ('so cute,' 'adorable,' 'cozy')"
- "Faith language is natural and unpretentious \u2014 'God Bless,' 'Jesus,' 'prayer'\
  \ used conversationally, not formally"
- "Family-first framing \u2014 products are discussed in relation to daughters, granddaughters,\
  \ sons, babies, and 'twinning' moments"
- "Compliment-reporting is a distinct behavior \u2014 buyers frequently note external\
  \ validation unprompted ('I've gotten so many compliments')"
- "Quality communicated through feel vocabulary \u2014 'soft,' 'cozy,' 'thick,' 'heavy\
  \ duty,' 'Comfort colors' are the dominant quality signals"
- "Repeat purchase intent stated explicitly and enthusiastically \u2014 'will definitely\
  \ order again,' 'I can't get enough,' 'bought two more'"
- "Shipping frustration expressed with resignation not rage \u2014 customers accept\
  \ it when disclosed upfront but resent surprise delays"
- "Sizing advice passed peer-to-peer in reviews \u2014 customers instinctively help\
  \ future buyers navigate inconsistency"
- Highly informal, abbreviation-heavy ('sm', 'omw', 'omg', 'af')
- "Emoji-dominant communication \u2014 emojis often replace or amplify words (\U0001F970\
  \U0001F60D\U0001F929\U0001F979)"
- Repeated letters for emotional intensity ('Sooo Cuteeee', 'Loveeee', 'Cuuuuuute')
- "Exclamation marks used prolifically \u2014 often 3-4 in a row"
- All-caps for strong positive reactions ('BUYING NOW', 'SO CUTE', 'HELL NO')
- "Community/in-group language \u2014 tagging friends, using brand-creator first names"
- Questions as social engagement rather than genuine inquiry ('how can you choose
  just one?!')
- "Warm, affirming register \u2014 no harsh criticism in the apparel-adjacent comments"
- 'Highly casual, enthusiastic, Gen-Z and Millennial register: ''bro,'' ''so sick,''
  ''fire,'' ''hype,'' ''dope,'' ''need it,'' ''AHHHH'''
- 'Heavy use of capitalization and repeated letters for emphasis: ''LOVEEEEE,'' ''stanleyyyyyy,''
  ''I LITERALLY NEED'''
- "Emoji as emotional punctuation \u2014 hearts, fire, praise hands used to reinforce\
  \ sentiment rather than replace words"
- 'Faith language blended casually with hype language: ''holy work,'' ''God bless,''
  ''keep doing God''s Work,'' ''the Lord is mighty'''
- "Gifting and sharing instinct surfaces repeatedly \u2014 'my mom would freak out,'\
  \ 'my sister would be ecstatic,' 'my brother loves to work out but he loves God\
  \ more'"
- 'Discovery excitement language: ''why didn''t anyone tell me,'' ''I didn''t know,''
  ''WHAT A PLEASANT SURPRISE'''
- 'Authenticity and boldness as core values: ''bold for Christ,'' ''showing your faith
  online,'' ''being real'''
- "Comments frequently include size requests, Instagram handle disclosures, country\
  \ of origin \u2014 signals high purchase intent masked as giveaway entry"
