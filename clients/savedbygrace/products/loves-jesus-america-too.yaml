unique_mechanism: The phrase itself is the mechanism — 'Loves Jesus + America, Too.'
  does the rare thing of combining two identities that the mainstream rarely puts
  together, in a single line that's wry, warm, and utterly unashamed. SBG Co. screen
  prints it on a super soft preshrunk tee using environmentally safe inks, so the
  statement lasts as long as the conviction behind it.
