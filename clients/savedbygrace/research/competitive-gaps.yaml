      sources:
      - uk.trustpilot.com (trustpilot)
    - gap: Store-credit-only return policy (no cash refunds) frustrates customers
        who want full refunds
      confidence: high
      money_quote: 'Returns: If we have deemed your return eligible, you will receive
        a store credit that has no expiration. We do not accept returns for refunds.'
      sources:
