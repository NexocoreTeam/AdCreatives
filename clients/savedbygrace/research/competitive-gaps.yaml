    - gap: Very narrow return eligibility window — damages must be reported within
        24-48 hours of delivery
      confidence: medium
      money_quote: We ask that you kindly + gently inspect all pieces of your shipment
        upon receipt and notify us of any damage within 24 hours of receiving. (This
        applies to all orders, with no exceptions to be made.)
      sources:
      - savedbygraceco.com/policies/refund-policy (brand-onsite)
    - gap: Large number of product categories excluded from returns creates customer
        confusion and distrust
      confidence: medium
      money_quote: 'We do not accept returns on the following items: skirts and shorts,
        holiday items, sale or marked down items, home decor or home goods, accessories
        of any kind, hats or beanies, items that have been worn or washed.'
      sources:
      - savedbygraceco.com/policies/refund-policy (brand-onsite)
      - savedbygraceco.com/pages/faq (brand-onsite)
    - gap: Brand identity transition from 'Saved by Grace Co.' to 'SBG Co.' may cause
        recognition confusion among existing customers
      confidence: low
      money_quote: SBG Co. (formerly Saved by Grace Co.) is a lifestyle brand for
        women, kids, and the spaces they call home.
      sources:
      - faire.com (wholesale marketplace)
    dealbreakers:
    - issue: No cash refunds under any circumstances — store credit only — causes
        customers to dispute charges and file chargebacks
      confidence: high
      money_quote: Can only return for credit not a refund. Very annoying.
      sources:
      - trustpilot.com/review/savedbythedress.com (trustpilot)
      - joinchargeback.com (third-party)
    - issue: Defective items not accepted for return, leaving customers stuck with
        unusable products
      confidence: medium
      money_quote: If you have a defective item they will not let you return it. I
        bought a bra that is suppose to stick and it falls right off almost instantly.
        I followed the directions on the return policy to email them if item is defective.
        When they responded they simply sent the return policy (which I already read
        and followed instructions). Customer service is awful.
      sources:
      - trustpilot.com/review/savedbythedress.com (trustpilot)
    - issue: Inflexible order modification policy — no changes or cancellations after
        order is placed
      confidence: medium
      money_quote: Tried to immediately delete my order so I could add more to my
        order, couldn't do that so I ordered again anyway. And immediately contacted
        customer service and got a canned response denying any and all changes.
      sources:
      - ca.trustpilot.com/review/thedailygraceco.com (trustpilot)
    - issue: Perceived as potentially fraudulent due to unexpected or unrecognized
        card charges labeled 'SB GRACE'
      confidence: low
      money_quote: Is SB GRACE fraud? The Guide to Understanding Why You Were Charged
        By 'SB GRACE' and What To Do About It (savedbygraceco.com)
      sources:
      - joinchargeback.com (third-party)
    - issue: Slow or non-responsive customer service triggers permanent customer loss
      confidence: medium
      money_quote: Customer service is awful. Even though I have gotten some nice
        dresses from here, I will no longer be a returning customer. Customer service
        matters, do better.
      sources:
      - trustpilot.com/review/savedbythedress.com (trustpilot)
    summary: 'Saved by Grace Co. commands genuine emotional loyalty from its core
      audience — faith-driven moms who love the made-to-order craftsmanship, meaningful
      designs, and brand authenticity built around founder Whitney Vaughn''s story.
      On Faire''s wholesale platform (504 reviews, 4.7 rating), retailer satisfaction
      is strong, signaling that the product itself is a proven commercial asset. However,
      the brand''s most significant friction points center on its operations: a 14-business-day
      turnaround, a rigid store-credit-only return policy with a narrow eligibility
      window, and unresponsive customer service are the primary reasons customers
      defect and file chargebacks — creating a clear switching opportunity for any
      competitor that can match SBG Co.''s product heart while offering more buyer-friendly
      post-purchase policies. Note: several source URLs in the research set belong
      to unrelated companies (Saved By The Dress, Saving Grace CBD, savinggrace.help),
      and those signals were excluded or flagged accordingly; findings above are drawn
      only from sources clearly attributable to savedbygraceco.com and corroborating
      editorial coverage of the SBG Co. brand.'
