matrix:
- persona_name: All-Of-It Amber
  persona_id: primary
  cells:
  - awareness_stage: unaware
    what_they_know: She buys graphic tees from boutiques and Target. She wears her
      faith, her mom identity, and her humor in separate layers — different shirts
      for different contexts. She has never consciously articulated that these pieces
      of her identity could or should live on the same shirt.
    what_they_dont_know_yet: There is a brand built exactly for the woman she already
      is — faith-forward, funny, and unflinchingly herself — where the kids pieces
      coordinate with hers so the whole family looks intentional without looking like
      a costume.
    primary_angle: She is already dressing herself in fragments of her identity —
      this brand is what happens when someone finally builds the whole picture for
      her.
    hook_style: pattern-interrupt / identity-mirror
    example_hook: You are the same woman at church, at Target, and at the cookout.
      Why does your wardrobe act like you are three different people?
    framework: pas
    creative_mechanic: Identity Mirror — open with a visual of three outfits side
      by side (church tee, generic boutique tee, mom humor tee) then cut to one SBG
      Co. piece that does all three, worn by a real woman in a real carpool line.
    proof_to_surface: 426 products across faith, mom humor, patriotic, and lifestyle
      humor — all targeted at the same woman, because she is not a niche, she is the
      whole thing.
    cta: See what we mean →
    funnel_placement: cold
    notes: Do not mention 'Christian apparel' or 'faith brand' in the first line.
      Lead with the identity fragmentation she feels but has never named. Let the
      reveal that this is a faith-forward brand land mid-scroll or in the visual,
      not in the hook. Amber is allergic to being sold religion — she wants to be
      seen as a whole person first.
  - awareness_stage: problem_aware
    what_they_know: She has tried to find faith apparel that doesn't embarrass her
      and come up empty. She has typed 'cute Christian tees that don't look churchy'
      into Pinterest. She has settled for generic boutique tees that are fun but feel
      hollow. She knows the gap exists — she just hasn't found anyone who fills it.
    what_they_dont_know_yet: SBG Co. exists and was built specifically for this frustration.
      She also doesn't know that the kids pieces coordinate with hers — so the mom-and-mini
      photo she has been trying to style with mismatched pieces has a real solution.
    primary_angle: Her exact frustration — faith apparel that looks dated and preachy,
      or secular apparel with no faith layer — is the founding reason SBG Co. was
      built.
    hook_style: pain-callout / commiseration opener
    example_hook: If one more Christian store tries to sell me a tee that looks like
      it came with a bookmark and a WWJD bracelet, I am going to lose it.
    framework: pas
    creative_mechanic: Commiseration-to-Reveal — talking head (founder or relatable
      mom) venting about the exact problem in Amber's own language, then pivoting
      to show the product as the obvious answer she has been looking for.
    proof_to_surface: 10 years building this brand because the founder couldn't find
      what she wanted either. Made to order in Charlotte, NC — not a fast fashion
      dropship operation.
    cta: This is what you have been looking for →
    funnel_placement: cold
    notes: 'Use her exact search language: ''cute Christian tees that don''t look
      churchy.'' This is the hook that earns the tap. The competitor indictment (Kerusso,
      Christian bookstore aesthetic) should be implied by the visual, not stated by
      name — show the dated aesthetic, don''t sue it.'
  - awareness_stage: solution_aware
    what_they_know: She knows brands like Elevated Faith exist. She has seen faith
      apparel that is cleaner and more modern. She is actively comparing options and
      deciding which brand actually gets her full identity — not just the devotional
      side of it.
    what_they_dont_know_yet: SBG Co. is the only option in the category that serves
      all four of her message lanes (faith, mom humor, patriotic, lifestyle humor)
      in one place, with coordinating kids and baby pieces — so she can shop once
      and dress the whole family in pieces that actually go together.
    primary_angle: Other modern faith brands serve the devotional side of who she
      is. SBG Co. is the only brand that also handles the feral mom, the Diet Coke
      obsession, and the Fourth of July cookout — because she is all of it, not just
      one thing.
    hook_style: differentiation-frame / category-comparison
    example_hook: Most faith apparel brands make tees for your Sunday self. We make
      tees for your Tuesday self too — the one who needs a Diet Coke and is raising
      her kids feral.
    framework: fab
    creative_mechanic: 'The Full Closet Walk — a flat-lay or carousel showing the
      range: a faith tee, the FERAL pullover, a Diet Coke tee, a kids onesie, and
      a mom-and-mini coordinating set. No competitor named. Just the breadth of who
      she is, all in one brand.'
    proof_to_surface: 4,000+ boutique wholesale partners on Faire — the boutique buyers
      who curate for this exact woman have already voted. Featured on the Today Show.
    cta: Shop the full edit →
    funnel_placement: cold
    notes: This is the stage where SBG Co. wins on breadth. Elevated Faith is her
      comparison benchmark — SBG Co. beats it by being broader and warmer, not more
      minimal or devotional. Do not try to out-devotional Elevated Faith. Win on 'the
      whole you' positioning.
  - awareness_stage: product_aware
    what_they_know: 'She has seen SBG Co. on Instagram, in a friend''s post, or on
      Faire. She knows the aesthetic is right. She is hesitating on: will it fit like
      a normal shirt, will it arrive in time, does it come in her size, and will she
      look try-hard or preachy wearing it.'
    what_they_dont_know_yet: Made to order means it is made specifically for her —
      not a warehouse closeout. The made-in-Charlotte story is a quality signal, not
      a liability. The phrases are designed to feel warm and confident, not preachy
      — the Today Show featured it, meaning it passed the mainstream taste filter.
    primary_angle: Every objection she has about quality, fit, and timing can be answered
      by the made-to-order process and the proof that 4,600+ women have already ordered
      and loved it.
    hook_style: objection-annihilator / social proof cascade
    example_hook: Before you talk yourself out of it — it fits like a normal tee,
      ships from Charlotte, and 4,600 women already own one. Your only regret will
      be not ordering sooner.
    framework: pastor
    creative_mechanic: 'Review Parade with Fit Shot — UGC-style carousel or reel:
      real women wearing SBG Co. in real life contexts (school pickup, cookout, church
      lobby), interspersed with five-star review quotes addressing each objection
      (fit, quality, timing, message tone).'
    proof_to_surface: 4,600+ Faire orders. Today Show feature. Made to order in North
      Carolina. Verified buyer reviews calling out fit and quality specifically.
    cta: Shop now — made just for you →
    funnel_placement: warm
    notes: The made-to-order model is her biggest latent objection (timing anxiety).
      Address it directly and frame it as a quality signal, not a warning. 'Made specifically
      for you' reframes wait time as craft, not inconvenience. Pull real review quotes
      if available — do not write fake review language.
  - awareness_stage: most_aware
    what_they_know: She wants it. She is in the cart or close to it. She needs a final
      push — urgency, reassurance, or a reason to buy today instead of closing the
      tab.
    what_they_dont_know_yet: There may be a limited seasonal window, a holiday deadline
      for made-to-order lead time, or a specific bundle opportunity (grab the matching
      kids piece while she is here) she has not seen yet.
    primary_angle: She already knows she wants it. Give her permission to buy it now,
      remind her the mom-and-mini moment is more urgent than she thinks, and hand
      her the path to checkout.
    hook_style: urgency-close / aspiration-crystallizer
    example_hook: You have been screenshot-saving this for a week. The matching onesie
      for your baby is right there. Order today and wear both by the weekend.
    framework: aida
    creative_mechanic: The Screenshot-to-Cart Close — retargeting ad showing the exact
      product she viewed, paired with the coordinating kids piece she did not see,
      with a countdown or seasonal urgency message. Static image or short video.
    proof_to_surface: Made to order — meaning once you order, this is made for you
      specifically. Not a mass-production item. If you want it for the holiday, the
      clock is real.
    cta: Complete your order →
    funnel_placement: retargeting
    notes: Do not over-discount at this stage — Amber is buying on identity and aesthetics,
      not price. A discount can cheapen the brand signal she is buying into. Urgency
      from seasonal lead time or mom-and-mini bundling is more on-brand than a promo
      code. If a limited edition or seasonal design is relevant, lead with that instead.
- persona_name: Grandma Gift-Giver Gloria
  persona_id: secondary
  cells:
  - awareness_stage: unaware
    what_they_know: Gloria buys baby gifts from Target, Amazon, and Pottery Barn Kids.
      She thinks of baby gifts as practical — onesies, blankets, rattles. She wants
      to give something meaningful but has not conceptualized that apparel with a
      faith message can be giftable, meaningful, and actually something her daughter
      will use.
    what_they_dont_know_yet: There is a brand that makes faith-message baby and kids
      apparel beautiful enough that her daughter will put it on the baby, photograph
      it, and text Gloria a picture — and that the same brand makes pieces her daughter
      can wear herself so Gloria can gift the whole family moment.
    primary_angle: The most meaningful baby gift is one the mom actually dresses the
      baby in — and this brand makes the ones she shows off, not the ones she stores
      in the drawer.
    hook_style: story-opener / emotional-future-pacing
    example_hook: The baby gifts that get photographed and shared are never the ones
      from the registry. They are the ones someone chose because they actually knew
      the family.
    framework: bab
    creative_mechanic: 'The Photo Text Moment — a short video or carousel showing
      a grandma''s phone screen: a text from her daughter with a photo of the baby
      in an SBG Co. onesie and a heart emoji. No words needed. The emotion lands without
      selling.'
    proof_to_surface: Heaven Sent Onesie, Wild Like My Curls, and a full baby collection
      designed around faith and personality — not generic pastel patterns.
    cta: Find a gift she will actually love →
    funnel_placement: cold
    notes: Gloria is not searching for SBG Co. — she is being found. This cold ad
      should run wherever her daughter's demographic runs (Facebook, Instagram) with
      targeting that reaches women 55–72. The hook should feel like something Gloria
      would forward to her daughter — not like a store ad. Avoid product-first framing.
      Lead with the gift moment, not the product.
  - awareness_stage: problem_aware
    what_they_know: She is at the baby shower planning stage or holiday prep mode.
      She knows Target and Amazon will produce another generic gift. She wants something
      personal and faith-reflecting. She has looked at Christian bookstore baby items
      and felt the dated aesthetic was wrong for her modern daughter. She is stuck.
    what_they_dont_know_yet: 'SBG Co. exists as the bridge: faith-meaningful without
      being cheesy, baby apparel that a stylish young mom would actually dress the
      baby in, and giftable in a way that signals she really thought about it.'
    primary_angle: She knows the gift she wants to give — something faith-forward
      and personal — she just hasn't found the brand that delivers it without looking
      like it came from 1999.
    hook_style: pain-validation / generational-bridge
    example_hook: You want to give the baby something that means something — not another
      onesie with ducks on it and not a wall cross from the church gift shop. There
      is a middle option.
    framework: pas
    creative_mechanic: 'The ''Not That'' Pivot — quick visual comparison: a generic
      Amazon baby gift (implied, not branded), then a cheesy Christian bookstore item
      (implied), then an SBG Co. Heaven Sent onesie or faith-message baby tee. Clean,
      warm, beautiful. Let the aesthetic do the argument.'
    proof_to_surface: Made to order in Charlotte, NC — not a mass-market product.
      Today Show feature as a trust signal she can tell her daughter about.
    cta: Give her something she will actually use →
    funnel_placement: cold
    notes: 'Gloria''s primary fear is her daughter''s reaction, not her own. Every
      message should answer the implicit question: ''Will my daughter love this?''
      The Today Show mention is the credibility signal that works on Gloria — it is
      the mainstream proof she needs to feel safe ordering from a brand she has never
      heard of.'
  - awareness_stage: solution_aware
    what_they_know: She has seen faith-forward baby and kids apparel in her daughter's
      world — maybe in a baby shower photo, on Instagram, or on Faire. She knows modern
      faith apparel can look good. She is now evaluating where to buy and whether
      SBG Co. is the right source.
    what_they_dont_know_yet: SBG Co. ships from Charlotte, has been in 4,000+ boutiques
      (meaning it is quality-vetted by real store buyers), and has a full baby collection
      — not just one or two token items. She can also find a matching piece for her
      daughter to make it a full family gift.
    primary_angle: SBG Co. is the brand her daughter's boutique probably already carries
      — vetted, real, quality-tested by 4,000 store buyers — and Gloria can order
      directly for less than boutique price.
    hook_style: credibility-transfer / insider-framing
    example_hook: If you have ever seen a stylish mom at church in a tee that felt
      real and not preachy — there is a good chance it was Saved by Grace Co. This
      is where you get it.
    framework: aida
    creative_mechanic: 'The Boutique Credibility Bridge — show an SBG Co. display
      in a boutique context (styled rack, warm store lighting, coordinating mom-and-mini
      pieces together), then cut to the same pieces available to order online. The
      message: your daughter''s boutique probably carries this.'
    proof_to_surface: 4,000+ boutique wholesale partners. 4,600+ Faire orders. Featured
      on the Today Show. Made in Charlotte, NC.
    cta: Shop the baby and kids collection →
    funnel_placement: cold
    notes: Gloria is risk-averse about ordering from brands she doesn't know. The
      boutique credibility proof — that 4,000 real store owners staked their reputation
      on this product — is the objection killer for her. Lead with third-party validation,
      not brand self-description.
  - awareness_stage: product_aware
    what_they_know: 'Gloria has found SBG Co. — likely because her daughter sent her
      a link, she saw it at a shower, or her daughter is already a customer. She is
      on the site or considering ordering. Her blockers are: sizing uncertainty for
      babies, quality uncertainty for a first order, and timing anxiety around the
      shower or holiday date.'
    what_they_dont_know_yet: SBG Co. has a size guide, made-to-order quality control
      (each piece is made specifically for the order), and a Charlotte-based operation
      that gives her a real business to trust — not an anonymous Etsy seller.
    primary_angle: Her three real objections — sizing, quality, and timing — are each
      directly answerable by SBG Co.'s process, and a single reassurance message can
      close the gap between consideration and purchase.
    hook_style: objection-sequencer / trust-builder
    example_hook: Not sure what size to order for a three-month-old? Worried it won't
      arrive before the shower? Here is exactly what you need to know before you order.
    framework: pastor
    creative_mechanic: 'The Grandma FAQ — a simple, warm FAQ-style carousel or short
      video that answers her three questions in sequence: size guide visual, a real
      review about quality (''I have washed this ten times and it still looks new''),
      and the made-to-order timeline clearly explained. Warm, patient tone.'
    proof_to_surface: Made to order in Charlotte, NC — not a warehouse clearance item.
      Verified buyer reviews on quality and gifting experience. Today Show feature
      for trust scaffolding.
    cta: Order today — here is the size guide →
    funnel_placement: warm
    notes: Gloria may need her daughter's help completing this order — design the
      funnel experience with that in mind. A gift-note option or gift packaging mention
      in the CTA area will close the deal for her. She is not price-sensitive in the
      way Amber is — she will pay $32 for a baby tee if she is confident in quality
      and timing.
  - awareness_stage: most_aware
    what_they_know: Gloria is ready to order. She has the product in mind. She needs
      confirmation that she is making the right call and a clear path to checkout
      — ideally with the ability to add a matching adult piece for her daughter without
      starting over.
    what_they_dont_know_yet: She can add the matching mom piece to make it a full
      family gift — which is the gift that gets the phone call, not just a thank-you
      text. There may also be a timing deadline she should know about for her event
      date.
    primary_angle: She is one add-to-cart moment away from giving the gift that her
      daughter texts her a photo about — just remind her she can make it even better
      by adding the mom piece.
    hook_style: upsell-close / emotional-payoff
    example_hook: You are already getting the baby one. Get your daughter the matching
      tee. That is the gift that gets the text with a photo.
    framework: aida
    creative_mechanic: 'The Complete the Set Close — retargeting or post-browse static
      showing the baby or kids piece she viewed, with the coordinating adult women''s
      piece displayed beside it. Simple copy: ''Complete the gift. Get them both.''
      Clean, warm aesthetic.'
    proof_to_surface: Mom-and-mini coordinating collections — intentionally designed
      to go together. Made to order means both pieces are made fresh for her order
      specifically.
    cta: Add the matching mom tee →
    funnel_placement: retargeting
    notes: The emotional payoff for Gloria is not the tee itself — it is her daughter's
      reaction. Every CTA should be framed around the gift experience and the response
      she will get, not the product features. Keep the copy short and warm — Gloria
      is not reading long ad copy at this stage.
- persona_name: Boutique Buyer Brooke
  persona_id: tertiary
  cells:
  - awareness_stage: unaware
    what_they_know: Brooke buys for a customer who is a stylish Southern or Midwestern
      Christian mom. She carries faith-adjacent and lifestyle apparel from Faire.
      She has not been actively looking for faith apparel because her assumption is
      that faith apparel belongs in a Christian bookstore, not on her boutique floor.
    what_they_dont_know_yet: There is a faith-forward apparel brand that her own customer
      is already buying direct — which means Brooke is leaving margin on the table.
      SBG Co.'s wholesale catalog is available on Faire and was built specifically
      for boutiques like hers.
    primary_angle: Her customers are already wearing this brand — they are just buying
      it direct instead of through her boutique, and she is losing the sale.
    hook_style: lost-revenue-pattern-interrupt / competitive-threat
    example_hook: If a customer has walked into your boutique wearing a tee you didn't
      carry — and two other customers asked where it was from — you already know what
      you're missing.
    framework: pas
    creative_mechanic: 'The Floor Moment — a short scenario video: customer walks
      into boutique in an SBG Co. piece, two customers immediately ask about it, boutique
      owner doesn''t know what it is, cut to SBG Co. Faire page with 4,600+ orders.
      Text: ''You should be the one selling this.'''
    proof_to_surface: 4,600+ Faire orders. 4,000+ active boutique wholesale partners.
      The brand already has traction in her market segment — she is the gap.
    cta: See it on Faire →
    funnel_placement: cold
    notes: Brooke is a business buyer, not an emotional buyer. The hook needs to speak
      to her in revenue terms, not lifestyle terms. She does not need to be sold on
      the brand's mission — she needs to be sold on the revenue opportunity and the
      proof of demand. Lead with the Faire order count and the floor moment scenario.
  - awareness_stage: problem_aware
    what_they_know: She has looked for faith apparel on Faire and found mostly Kerusso-adjacent
      product that her customer would never touch. She knows her Southern and Midwestern
      customer base is faith-motivated. She knows the category exists. She cannot
      find the brand that bridges faith and modern boutique aesthetic.
    what_they_dont_know_yet: SBG Co. is the brand that solves this exact problem —
      built for boutique shelf appeal, not Christian bookstore racks. The catalog
      has SKU depth across faith, mom humor, patriotic, and lifestyle humor — enough
      to build a real display, not just hang three one-offs.
    primary_angle: The faith apparel gap on her floor is real — her customer wants
      it — and SBG Co. is the first brand in the category that looks like it belongs
      next to her other bestsellers.
    hook_style: category-gap-articulation / customer-voice
    example_hook: Your customer is faith-forward, funny, and stylish. Faire's faith
      apparel section has two of those three. We built the brand that has all of them.
    framework: fab
    creative_mechanic: 'The Shelf Gap Visual — a styled boutique rack with a visible
      gap between a lifestyle tee section and a blank space, then SBG Co. pieces filling
      it. No complicated copy. Just: ''This is the hole in your boutique. This is
      what fills it.'''
    proof_to_surface: 4,000+ boutique partners have already filled this gap. Today
      Show feature means her customers have seen it on national TV and trust it.
    cta: Browse the wholesale catalog on Faire →
    funnel_placement: cold
    notes: Brooke is sophisticated — do not oversell or use DTC consumer-style emotional
      language with her. Speak buyer-to-buyer. The proof that 4,000 boutique owners
      already carry this is her primary buying signal — she trusts peer validation
      more than brand self-description.
  - awareness_stage: solution_aware
    what_they_know: 'She is aware that modern faith apparel brands exist. She may
      have looked at Elevated Faith or similar. She is evaluating SBG Co. against
      other options on Faire and is asking: does this have the depth, margin, and
      sell-through predictability I need?'
    what_they_dont_know_yet: SBG Co.'s coordinating mom-and-mini SKU structure means
      she can build a display (not just a few one-offs), driving higher average transaction
      values and repeat customer visits. The Today Show feature and Faire order count
      are demand proof that de-risks the buy.
    primary_angle: SBG Co. is not just another faith tee brand — it is a display-building,
      conversation-starting, repeat-traffic system for her floor, built around the
      coordinating mom-and-mini structure no competitor offers.
    hook_style: differentiation-proof / category-superiority
    example_hook: Most faith apparel on Faire gives you a few tees to hang on a rack.
      Saved by Grace Co. gives you a display — women's, kids, baby, coordinating sets
      — that builds itself and sells by word of mouth.
    framework: fab
    creative_mechanic: 'The Display Build — a time-lapse or step-by-step visual of
      a boutique display being built with SBG Co. pieces: women''s tees, kids tees,
      a onesie, a coordinating set, a hat. Final frame: a shopper stopping in front
      of it. Copy: ''4,000 boutiques are running this display. Ready to be one of
      them?'''
    proof_to_surface: '4,600+ Faire orders. 4,000+ boutique partners. SKU depth: 426
      products across 4 message lanes with coordinating kids and baby. Today Show
      national press feature.'
    cta: Build your display — browse on Faire →
    funnel_placement: cold
    notes: Brooke's secondary objection is exclusivity — she does not want to carry
      something her competitor across town also carries. Address this by emphasizing
      that the message lanes are differentiated (no one else has this specific voice)
      and that the brand's 4,000 boutique distribution is spread across a large geographic
      footprint, not saturated locally. If regional exclusivity tiers exist, mention
      them here.
  - awareness_stage: product_aware
    what_they_know: 'She has found SBG Co. on Faire. She sees the order count and
      reviews. She is running the business math: margin, lead time, minimum order,
      seasonal reliability, and whether her customers will still be buying this in
      six months.'
    what_they_dont_know_yet: SBG Co.'s made-to-order model means she is not sitting
      on dead inventory — she orders what she needs, when she needs it. The catalog
      is designed for seasonal moments (Fourth of July, Christmas, back to school)
      that give her built-in reorder triggers. The message lanes are evergreen enough
      to not feel trendy.
    primary_angle: Her three real objections — margin, lead time, and sell-through
      longevity — are each directly addressable, and the made-to-order model actually
      reduces her inventory risk compared to traditional wholesale.
    hook_style: objection-sequencer / risk-reversal
    example_hook: Before you close the Faire tab — here is the margin math, the lead
      time reality, and why 4,000 boutiques are still reordering this brand two years
      in.
    framework: pastor
    creative_mechanic: 'The Buyer Brief — a one-page or carousel format styled like
      a buyer''s brief: margin line, lead time, SKU count, seasonal reorder calendar,
      review count. Not an ad, a document. Brooke responds to information, not emotion.'
    proof_to_surface: 4,600+ Faire orders. 4,000+ boutique partners actively reordering.
      Today Show feature (demand signal, not just vanity press). Made to order — no
      minimum dead inventory risk.
    cta: Request wholesale info on Faire →
    funnel_placement: warm
    notes: Brooke has burned money on Faire brands that looked good but had quality
      complaints. The Today Show mention and the 4,600-order count are her risk mitigation
      signals — use them prominently. Do not bury them in copy. If there is a returnability
      or quality guarantee policy, surface it here. She is also watching for signs
      of over-distribution — be prepared to address geographic market density concerns.
  - awareness_stage: most_aware
    what_they_know: She is ready to place a first order or has already placed one.
      She needs confirmation that the timing works for her next buying window (holiday,
      seasonal), a clear reorder path, and ideally a reason to increase her initial
      order size.
    what_they_dont_know_yet: SBG Co.'s seasonal calendar (Fourth of July, Christmas,
      back to school) gives her predictable reorder moments. The mom-and-mini display
      structure means a higher average basket for her customers — which means she
      should be ordering deeper than she initially planned.
    primary_angle: Her first order is the beginning of a seasonal reorder system —
      give her the buying calendar and the display guide so she sees this as a long-term
      floor fixture, not a one-off test.
    hook_style: commitment-expansion / seasonal-urgency
    example_hook: Your Fourth of July window is eight weeks out. Here is the SBG Co.
      display that has sold through in every boutique that ran it last summer — and
      the reorder guide to keep up with demand.
    framework: aida
    creative_mechanic: 'The Seasonal Buying Calendar Close — a simple visual calendar
      showing SBG Co.''s peak seasonal moments (Fourth of July, back to school, Christmas)
      with recommended order lead times and bestselling SKUs per season. CTA: ''Start
      your first order now to hit your July window.'''
    proof_to_surface: 4,000+ boutiques reordering seasonally. Today Show demand proof.
      The All-American Edit and Faith Edit collections as anchors for her seasonal
      buys.
    cta: Place your first order on Faire →
    funnel_placement: retargeting
    notes: Brooke responds to peer validation over brand storytelling. If there are
      testimonials from other boutique owners about sell-through rates or customer
      reactions, this is the stage to deploy them — a real buyer quote about floor
      performance is worth ten brand claims. The goal of this cell is not to close
      a transaction — it is to close a long-term wholesale relationship.
cross_stage_observations:
  highest_leverage_stages:
  - solution_aware (Amber) — This is SBG Co.'s single biggest competitive battleground.
    Amber is actively comparing and SBG Co. wins decisively on breadth and tone. The
    'all of you, not just your Sunday self' angle is unmatched in the category and
    should receive the largest creative investment.
  - problem_aware (Gloria) — Gloria is highly reachable at this stage via her daughter's
    social graph and shower/holiday timing. The friction is not desire, it is confidence.
    A single well-executed trust-building ad here closes the gift purchase with minimal
    funnel complexity.
  - product_aware (Brooke) — Brooke is a high-value converter who needs information,
    not inspiration. One strong buyer-brief-style creative at this stage likely converts
    a $500–2,000 first wholesale order. The ROI per converted buyer is significantly
    higher than DTC.
  weakest_stages:
  - unaware (Gloria) — Cold awareness for a 55–72 demographic requires Facebook placement
    and social proof from her daughter's world. Without VOC data or a daughter-referral
    mechanic, this stage is expensive to execute well and should be deprioritized
    unless SBG Co. has strong Facebook creative infrastructure.
  - unaware (Brooke) — Reaching boutique buyers cold without Faire's native discovery
    algorithm or a trade show presence is difficult. The highest-leverage cold channel
    for Brooke is Faire's own trending/new section, not paid social. Paid cold ads
    for Brooke should be considered secondary to organic Faire optimization.
  - most_aware (Amber) — Amber is emotionally ready to buy but price-sensitive to
    discounting. Urgency mechanics here are limited to seasonal lead time and mom-and-mini
    bundling — which are strong but require seasonal creative refreshes to stay relevant.
    A static evergreen retargeting ad will decay quickly for this persona.
  ad_distribution_recommendation: 'For DTC (Amber-focused): allocate 40% of creative
    volume to solution_aware stage — this is the conversion engine. Allocate 30% to
    problem_aware cold traffic to fill the funnel. Allocate 20% to product_aware retargeting
    with UGC and review-led creative. Reserve 10% for most_aware cart-abandonment
    retargeting with mom-and-mini bundle close. For wholesale (Brooke-focused): invest
    the majority of touchpoints in Faire organic optimization and product_aware direct
    outreach rather than paid social. For gifting (Gloria-focused): time paid social
    to the 8-week window before peak gifting seasons (Christmas, Easter, Mother''s
    Day) with problem_aware creative targeted at the 55–72 demographic on Facebook.'
  category_specific_notes: SBG Co. operates in a category — faith apparel — where
    the dominant incumbent aesthetic (Kerusso, Christian bookstore) is so distinct
    and so dated that category indictment is a nearly frictionless creative angle.
    Ads that simply show the contrast between the old aesthetic and SBG Co.'s modern
    execution will outperform explanation-heavy creative at every stage. The made-to-order
    model is simultaneously the brand's most defensible quality proof and its most
    commonly cited purchase barrier — every creative touchpoint should proactively
    reframe wait time as craft signal, not operational limitation. The mom-and-mini
    coordinate structure is SBG Co.'s highest-leverage product mechanic and most underdeveloped
    creative angle — a disproportionate share of future creative should visualize
    the family moment (mom and child in coordinating SBG Co. pieces) because no competitor
    can replicate this and it is the highest emotional trigger for both Amber and
    Gloria.
