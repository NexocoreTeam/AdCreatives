trending_format_recommendations:
- format_id: listicle
  name: Listicle
  summary: Classic "3 reasons why" / numbered format. Same script distributed across
    multiple creators with distinct personas. Often paired with negative marketing
    ("3 reasons NOT to buy X" or "3 things I wish I knew"). Bottom-of-barrel creatively
    but reliably saves campaigns.
  format_type: video
  production_complexity: low
  rank: 1
  rationale: "Brooke is product_aware and methodical \u2014 she's been burned twice\
    \ and is now actively researching what makes faith apparel actually move. A listicle\
    \ like '3 things to look for in faith apparel that actually sells in a boutique'\
    \ maps directly onto her decision-making mode and lets the SLAP framework deliver\
    \ the payoff (problem acknowledged, solution itemized, action clear)."
  production_notes: "Anchor each list item to a boutique-specific buying signal (aesthetic\
    \ fit, margin, reorder velocity) \u2014 avoid generic faith language that reinforces\
    \ her fear of Christian bookstore vibes."
- format_id: were-not-cheap
  name: We're Not Cheap (Objection Handling)
  summary: Direct objection handling. Lead hook is "We're not cheap and we don't want
    to be" followed by specific reasons (ingredients, supply chain, ethics, manufacturing).
    Classic objection-handling sales technique applied to creative.
  format_type: both
  production_complexity: low
  rank: 2
  rationale: "Brooke's core objection is not price \u2014 it's sellability \u2014\
    \ so flipping the objection-handling frame to 'we're not your typical wholesale\
    \ faith brand, and here's why your customers will actually buy this' directly\
    \ addresses her twice-burned skepticism. Her product-aware status means she needs\
    \ reasons, not discovery, and this format delivers structured conviction."
  production_notes: "Reframe 'not cheap' as 'not generic' \u2014 the hook should pivot\
    \ immediately to boutique-fit proof points (modern design, customer identity resonance)\
    \ rather than dwelling on cost justification."
- format_id: obvious-ai-slop
  name: Obvious AI Slop
  summary: "Pixar-style animated characters being intentionally cringe (e.g. \"Hi\
    \ I'm Vitamin D3\", \"I'm your stinky coochie\"). Works precisely BECAUSE it's\
    \ obviously fake \u2014 bypasses the \"is this person real?\" skepticism that's\
    \ killing traditional UGC. The cartoonish framing travels well across demographics\
    \ because it sidesteps the trust question entirely \u2014 even buttoned-up, research-driven\
    \ buyers engage with it as entertainment first, then absorb the product claim\
    \ almost as a side effect. Strong evergreen pattern for any brand that needs to\
    \ break through scroll-fatigue."
  format_type: video
  production_complexity: medium
  rank: 3
  rationale: "A Pixar-style animated tee that literally walks into a boutique and\
    \ says 'I actually sell' would cut through Brooke's scroll fatigue with self-aware\
    \ humor while signaling that the brand understands modern retail aesthetics \u2014\
    \ the irony of a faith product using the least 'Christian bookstore' format possible\
    \ reinforces the angle viscerally."
  production_notes: "The cringe must be intentional and controlled \u2014 keep the\
    \ character on-brand (toddler aesthetic, lifestyle tone) so the humor lands as\
    \ clever rather than undermining the premium boutique positioning Brooke needs\
    \ to justify to her customers."
