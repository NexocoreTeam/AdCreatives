brief_id: savedbygrace-toddlerhood-it's-a-lifestyle-tee-f04892
client: savedbygrace
product: Toddlerhood - "It's a Lifestyle" Tee
awareness_level: product_aware
mental_stage: exploration
trigger_moment: ''
framework: slap
angle: "Faith apparel that actually sells \u2014 what to look for when you're done\
  \ stocking things that just sit there"
hook: "She tried carrying Christian apparel twice.\nBoth times it sat on the rack\
  \ until she marked it down and moved on.\nThe third time, she looked for something\
  \ different \u2014 not a faith tee,\na lifestyle brand that happened to carry a\
  \ faith message.\nThat's the one her customers stopped to read out loud.\n"
hook_type: Story / Result (Empathy + Relief)
slot: 2
hook_source: avatar pain quote I tried carrying Christian apparel before and it just
  sits there plus gap 3 faith apparel that does not feel churchy
hook_tactic: "Storytelling \u2014 drop mid-scene into the category problem a boutique\
  \ buyer already lives, let the product appear as background resolution"
persona: Boutique Buyer Brooke
creative_mechanic: micro_story_plus_suspense
visual_format: "Organic video (UGC style) \u2014 a boutique owner walking her shop\
  \ floor, pausing at a rack, the tee visible but not hero; voiceover narrates the\
  \ story while the visual shows the environment the buyer actually lives in"
visual_format_alternatives:
- "Scroll-style static carousel \u2014 each card is a line of the story, final card\
  \ shows the tee styled on a boutique display with the resolution line as overlay\
  \ text"
- "Split-screen video \u2014 left side shows generic churchy faith tee on a clearance\
  \ rack; right side shows the SBG Co. tee being picked up and read by a customer\
  \ in-store, no voiceover needed"
persona_traits: Boutique buyer who has already burned margin on faith apparel that
  wouldn't move and is now quietly forming a picture of what a faith brand would have
  to look like before she tries again
pain_point: "Most faith apparel available at wholesale looks like it belongs in a\
  \ Christian bookstore, not a modern boutique \u2014 her customers skip it on the\
  \ rack"
benefit_callouts:
- "Lifestyle-first framing \u2014 the phrase does the selling before you say a word"
- Mom-and-mini SKUs let you build a display, not just hang a single piece
- "Soft enough that customers come back \u2014 ringspun cotton that holds up past\
  \ the first wash"
cta: "See how it merchandises \u2014 browse the collection on Faire"
body_copy: ''
visual_direction: "Keep the product present but not dominant. The story is about the\n\
  category failure the buyer already knows \u2014 the tee appears as the\nquiet resolution\
  \ in the final frame. A real boutique environment\n(warm lighting, wood fixtures,\
  \ layered product) makes the buyer see\nherself in the scene. The goal is recognition,\
  \ not admiration.\n"
tone_override: ''
target_platform: meta
source_insight: angle_multiplier
