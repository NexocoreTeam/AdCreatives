- format_id: obvious-ai-slop
  name: Obvious AI Slop
  summary: "Pixar-style animated characters being intentionally cringe (e.g. \"Hi\
    \ I'm Vitamin D3\", \"I'm your stinky coochie\"). Works precisely BECAUSE it's\
    \ obviously fake \u2014 bypasses the \"is this person real?\" skepticism that's\
    \ killing traditional UGC. The cartoonish framing travels well across demographics\
    \ because it sidesteps the trust question entirely \u2014 even buttoned-up, research-driven\
    \ buyers engage with it as entertainment first, then absorb the product claim\
    \ almost as a side effect. Strong evergreen pattern for any brand that needs to\
    \ break through scroll-fatigue."
  format_type: video
  production_complexity: medium
  rank: 2
  rationale: "The hook's self-aware humor ('Nobody told my toddler') signals this\
    \ audience appreciates irreverence, and an animated toddler character declaring\
    \ 'Toddlerhood is a lifestyle' in Pixar-cringe style would dramatize the angle\
    \ viscerally while making the reframe impossible to ignore. The intentionally-fake\
    \ aesthetic also bypasses skepticism from gift-buyers who've seen too many polished\
    \ baby-product ads that feel generic \u2014 exactly Gloria's pain point."
  production_notes: "The animated character must embody a specific, recognizable toddler\
    \ personality archetype (chaos gremlin, snack goblin, etc.) rather than a generic\
    \ cute kid \u2014 vagueness kills the 'personality to celebrate' angle this entire\
    \ brief is built on."
- format_id: tiktok-short-pov
  name: TikTok Short / POV
  summary: 'One or two lines TOPS over a candid clip of a real person in a mundane
    real moment (at a desk, on a Zoom call). Two line registers: (a) a meme-native
    identity flex / after-state self-aware joke borrowed from caption formats live
    in the operator''s own feed right now ("Healed so hard I''m almost as weird as
    I was in middle school", "Serving looks and spreadsheets"), or (b) a POV scenario
    open ("POV: ..."). The line never makes a product claim; the person is thriving
    and the line carries the vibe. Brand presence stays minimal (account, caption,
    product casually in frame). Visual: a single candid clip with natural motion,
    or the stronger locked-camera variation cut (same seat, two outfits = two days).
    Never a dead static clip. Primary job: the rapid, cheap messaging TEST BED; winning
    lines graduate into love letters, creator briefs, and paid hooks. Also the easiest
    iteration on an existing winner: keep the line, swap the background and the face.
    Spec refined 2026-06-11 from operator-provided source examples.'
  format_type: video
  production_complexity: low
  rank: 3
