brief_id: savedbygrace-loves-jesus-america-too.-e5792e
client: savedbygrace
product: Loves Jesus + America, Too.
awareness_level: solution_aware
mental_stage: exploration
trigger_moment: ''
framework: four_cs
angle: "The unspoken rule of faith apparel is that you have to pick a lane \u2014\
  \ this shirt quietly proves that was never true"
hook: "Here's the thing nobody in the faith apparel space wants to admit:\nMost of\
  \ it makes you choose.\nPreachy or plain. Churchy or cute. Faith or personality.\n\
  There's this shirt that just says: Loves Jesus + America, Too.\nThe \"Too\" is doing\
  \ a lot of work.\nLike \u2014 yes, both things. At the same time. On one shirt.\n\
  Wild that it took this long.\n"
hook_type: Curiosity Gap (Intrigue)
slot: 4
hook_source: competitive-gap faith apparel that doesnt feel churchy or dated plus
  avatar desire quote a brand that sees her whole identity
hook_tactic: "Contrarian \u2014 opens by challenging the category assumption (you\
  \ have to pick one) before the reveal that you don't"
persona: All-Of-It Amber
creative_mechanic: contrast_plus_aspirational_identity
visual_format: "Text-on-product static \u2014 clean close-up of the phrase on the\
  \ tee, no face, with short punchy copy lines stacked alongside it"
visual_format_alternatives:
- "Split-screen video \u2014 left side shows a stiff, dated Christian bookstore tee;\
  \ right side shows the SBG Co. tee worn casually in a real-life moment. No labels,\
  \ no commentary."
- "Talking head reel \u2014 creator holds up the shirt and delivers the 'Too is doing\
  \ a lot of work' line to camera with dry warmth, then shows it on"
persona_traits: Values-driven mom who has spent years splitting her wardrobe between
  what's cute and what actually means something, and never found one thing that was
  both
pain_point: "Generic boutique tees and Etsy mom humor shirts are funny but empty \u2014\
  \ they don't reflect the faith layer that matters to her"
benefit_callouts:
- "Faith + patriotism in one phrase \u2014 no explanation required"
- Wry enough for the cookout, real enough for Sunday
- The brand that stopped making her choose
cta: Shop Loves Jesus + America, Too. at SBG Co.
body_copy: ''
visual_direction: "Let the phrase carry the image. Close crop on the screen-printed\
  \ text \u2014 crisp, warm, nothing clinical. \nThe shirt should feel worn-in and\
  \ real, not stiff or catalog-fresh. \nIf a face appears at all, it's a half-smile,\
  \ not a billboard grin. \nRed or blue colorway \u2014 whichever reads more immediately\
  \ as American without being costume-y.\n"
