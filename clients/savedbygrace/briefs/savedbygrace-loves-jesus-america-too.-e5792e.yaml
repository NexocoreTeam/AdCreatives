trending_format_recommendations:
- format_id: david-and-goliath
  name: David & Goliath
  summary: Underdog brand vs giant industry/competitor. Calls out an enemy first (a
    specific competitor, a massive scam, or the broken status quo), then contrasts
    with your brand using core differentiators and the science of why you're better.
    Animations on the science boost retention.
  format_type: both
  production_complexity: medium
  rank: 1
  rationale: "Amber is solution-aware and frustrated by a broken category \u2014 the\
    \ angle explicitly calls out the false binary imposed by the faith apparel industry,\
    \ making David & Goliath a natural fit to name that enemy (generic boutique tees,\
    \ Etsy humor shirts) and contrast it with a shirt that refuses to choose. The\
    \ 'unspoken rule' hook and curiosity-gap framing map directly onto this format's\
    \ 'call out the broken status quo first' structure."
  production_notes: "Ensure the 'Goliath' isn't a specific named competitor but rather\
    \ the broader industry norm of forced choice \u2014 this keeps it aspirational\
    \ rather than litigious and resonates with Amber's identity-driven frustration\
    \ rather than brand rivalry."
- format_id: obvious-ai-slop
  name: Obvious AI Slop
  summary: "Pixar-style animated characters being intentionally cringe (e.g. \"Hi\
    \ I'm Vitamin D3\", \"I'm your stinky coochie\"). Works precisely BECAUSE it's\
    \ obviously fake \u2014 bypasses the \"is this person real?\" skepticism that's\
    \ killing traditional UGC. The cartoonish framing travels well across demographics\
    \ because it sidesteps the trust question entirely \u2014 even buttoned-up, research-driven\
    \ buyers engage with it as entertainment first, then absorb the product claim\
    \ almost as a side effect. Strong evergreen pattern for any brand that needs to\
    \ break through scroll-fatigue."
  format_type: video
  production_complexity: medium
  rank: 2
  rationale: "The curiosity-gap hook and irreverent angle give permission to lean\
    \ into a format that is self-aware and disarming \u2014 Amber is scroll-fatigued\
    \ and has seen every sincere faith-apparel ad, so an obviously stylized Pixar-esque\
    \ character delivering the 'nobody wants to admit this' hook cuts through without\
    \ triggering her skepticism toward traditional UGC. The intentional artificiality\
    \ actually reinforces the brand's refusal to play by category rules."
  production_notes: "The character voice and script must stay sharp and confident\
    \ rather than goofy \u2014 cringe works here only if the underlying message lands\
    \ with conviction, so avoid letting the aesthetic overwhelm the 'faith plus identity'\
    \ payoff in the final beat."
- format_id: listicle
  name: Listicle
  summary: Classic "3 reasons why" / numbered format. Same script distributed across
    multiple creators with distinct personas. Often paired with negative marketing
    ("3 reasons NOT to buy X" or "3 things I wish I knew"). Bottom-of-barrel creatively
    but reliably saves campaigns.
  format_type: video
  production_complexity: low
  rank: 3
  rationale: "Amber is solution-aware, meaning she has already evaluated options and\
    \ found them lacking \u2014 a '3 reasons most faith tees make you pick a lane\
    \ (and why this one doesn't)' structure lets her confirm her own frustration while\
    \ walking her through the Four Cs framework in a digestible, low-friction way.\
    \ The negative framing variant ('3 things faith apparel brands won't tell you')\
    \ mirrors the brief's angle of exposing an industry blind spot."
  production_notes: "Avoid making the list feel like a generic product-feature rundown\
    \ \u2014 each point must speak directly to the identity tension Amber feels between\
    \ her faith expression and her aesthetic standards, or the format will read as\
    \ flat and forgettable."
