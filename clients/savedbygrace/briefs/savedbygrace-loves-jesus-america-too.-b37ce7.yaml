brief_id: savedbygrace-loves-jesus-america-too.-b37ce7
client: savedbygrace
product: Loves Jesus + America, Too.
awareness_level: solution_aware
mental_stage: exploration
trigger_moment: ''
framework: quest
angle: The exhausting search for faith apparel that doesn't look churchy ends the
  moment she finds the phrase that says it all
hook: "I typed \"cute Christian tees that don't look like a church bulletin\" into\
  \ Pinterest at 11pm.\nI'm not proud of how long I scrolled.\nThen I found one that\
  \ just said: Loves Jesus + America, Too.\nAnd I thought \u2014 yeah. That's literally\
  \ just me.\nI've worn it to church, the school pickup line, and a Fourth of July\
  \ cookout.\nNobody once looked at me like I was handing out a pamphlet.\n"
hook_type: Story / Result (Empathy + Relief)
slot: 2
hook_source: "avatar pain quote \u2014 cute Christian tees that dont look churchy\
  \ plus trigger event Pinterest search"
hook_tactic: "Storytelling \u2014 opens mid-scene with a relatable discovery moment,\
  \ then lands on the emotional payoff"
persona: All-Of-It Amber
creative_mechanic: micro_story_plus_suspense
visual_format: "UGC-style vertical video \u2014 woman speaking directly to camera,\
  \ casual home or kitchen setting, wearing the tee"
visual_format_alternatives:
- "Carousel static \u2014 each card shows one line of the story as text overlay on\
  \ lifestyle photography (church, pickup line, cookout)"
- "Voiceover reel \u2014 no talking head, just the tee in real-life settings while\
  \ the story plays as text and narration"
persona_traits: "Southern or Midwest mom, 28\u201340, who loves Jesus and loves America\
  \ and has never once found a shirt that said both without making her cringe"
pain_point: "Faith apparel from Christian stores looks dated, preachy, and impossible\
  \ to style \u2014 she would never wear it to Target or a birthday party"
benefit_callouts:
- Wears to church AND the grocery store without a costume change
- "Super soft, preshrunk \u2014 survives the wash and the lifestyle"
- The phrase that says it all without saying too much
cta: Find yours at SBG Co.
body_copy: ''
