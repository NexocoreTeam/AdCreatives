  \ tee at the kitchen counter or the car line. \nThe shirt should be visible but\
  \ incidental \u2014 this is about the feeling of finally being seen, \nnot a product\
  \ hero shot. Warm Southern light. Nothing polished enough to look like an ad.\n"
