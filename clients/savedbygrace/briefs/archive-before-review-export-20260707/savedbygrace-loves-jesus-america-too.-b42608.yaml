- "Talking head video \u2014 a boutique owner at her rack speaks directly to camera\
  \ about what happened when she put it on the floor, no script energy, just her words"
persona_traits: "Boutique owner in a Southern or Midwestern town who has been burned\
  \ by faith apparel that sat on the rack \u2014 she thinks in units, margin, and\
  \ reorder velocity, not vibes"
pain_point: She has burned money on wholesale brands that looked great on Faire but
