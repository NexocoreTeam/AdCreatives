brief_id: savedbygrace-loves-jesus-america-too.-b42608
client: savedbygrace
product: Loves Jesus + America, Too.
awareness_level: product_aware
mental_stage: evaluation
trigger_moment: ''
framework: fab
angle: "Wholesale peer validation \u2014 boutique buyers across the country are reordering\
  \ this tee because it sells itself off the rack"
hook: '4,000+ boutiques carry this. Most reorder before their first run sells through.

  That''s not a faith apparel stat. That''s a sell-through story.

  '
hook_type: Surprising Stat (Social Proof / Credibility)
slot: 1
hook_source: competitive-gap category skepticism plus Faire 4.7 rating 504 reviews
  wholesale proof
hook_tactic: "Statistic anchored to peer behavior \u2014 boutique buyers who chose\
  \ this and reordered"
persona: Boutique Buyer Brooke
creative_mechanic: authority_borrowing_plus_data_insight
visual_format: "Text-on-product photo \u2014 clean flatlay of the tee with a stat\
  \ overlay in brand typography"
visual_format_alternatives:
- "Carousel static \u2014 slide 1 is the stat hook, slide 2 shows the tee on a boutique\
