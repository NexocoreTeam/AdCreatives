framework: quest
angle: "The search that ends here \u2014 she typed 'cute Christian tees that don't\
  \ look churchy' and finally found what she was looking for"
hook: "She typed \"cute Christian tees that don't look churchy\" into Pinterest at\
  \ 11pm.\nSound familiar?\n\nHere's the thing \u2014 the ones that look good don't\
  \ say anything real.\nAnd the ones that say something real look like you're handing\
  \ out a tract at Target.\n\nThat's not a you problem. That's a category problem.\n\
  \nThe good news: a tee that says *Loves Jesus + America, Too.* exists \u2014\nand\
  \ it's the kind of thing you put on for church and then just\u2026 never take off.\n"
hook_type: Story / Result (Empathy + Relief)
slot: 2
hook_source: avatar pain I want to wear my faith but not look like Im handing out
  a tract + Pinterest trigger event
hook_tactic: "Storytelling \u2014 open mid-scene in the frustration moment, land on\
  \ the relief"
persona: All-Of-It Amber
creative_mechanic: tribal_belonging_plus_vulnerability
visual_format: "UGC-style carousel \u2014 first frame is a relatable 'the search'\
  \ moment (phone screen showing a Pinterest search), subsequent frames show the tee\
  \ worn casually in real life settings (school pickup, cookout, grocery run)"
visual_format_alternatives:
- "Talking-head video \u2014 woman speaks directly to camera in a casual, group-chat\
  \ tone recounting the failed search, cuts to her wearing the tee"
- "Text-on-lifestyle-photo static \u2014 bold overlay text reads the hook line over\
  \ a candid photo of the shirt being worn, no studio setup"
persona_traits: "Southern or Midwest mom, 28\u201340, who keeps striking out on faith\
  \ apparel because everything is either too churchy or too empty \u2014 she wants\
  \ one shirt that tells the whole story without trying too hard"
pain_point: "Faith apparel looks dated and preachy \u2014 she can't find anything\
  \ that reflects both her faith and her real life without looking like a church handout"
benefit_callouts:
- Faith-forward without the tract energy
- Soft enough to live in, strong enough to mean something
- "Made to order in Charlotte, NC \u2014 not mass-printed to a shelf"
cta: Find the tee that finally fits who you actually are
body_copy: ''
visual_direction: "Warm, real-life settings \u2014 not a studio. The tee should appear\
  \ in the context of an ordinary Tuesday, worn by someone who looks like she could\
  \ be in Amber's group chat. The vibe is recognition, not aspiration."
