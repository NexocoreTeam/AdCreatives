trending_format_recommendations:
- format_id: david-and-goliath
  name: David & Goliath
  summary: Underdog brand vs giant industry/competitor. Calls out an enemy first (a
    specific competitor, a massive scam, or the broken status quo), then contrasts
    with your brand using core differentiators and the science of why you're better.
    Animations on the science boost retention.
  format_type: both
  production_complexity: medium
  rank: 1
  rationale: "Amber is solution-aware and actively frustrated with the broken status\
    \ quo of faith apparel \u2014 she's already searched, already been disappointed,\
    \ and needs to see someone call out exactly what's wrong with the category before\
    \ presenting an alternative. The 'enemy' here is generic churchy merch, and this\
    \ format lets the brand contrast itself as the underdog who actually gets her\
    \ aesthetic and her faith simultaneously."
  production_notes: "The 'Goliath' must be the category norm (preachy, dated tees),\
    \ not a named competitor \u2014 keep it relatable and empathetic, not combative,\
    \ so it mirrors Amber's internal frustration rather than feeling like brand beef."
- format_id: listicle
  name: Listicle
  summary: Classic "3 reasons why" / numbered format. Same script distributed across
    multiple creators with distinct personas. Often paired with negative marketing
    ("3 reasons NOT to buy X" or "3 things I wish I knew"). Bottom-of-barrel creatively
    but reliably saves campaigns.
  format_type: video
  production_complexity: low
  rank: 2
  rationale: "A solution-aware Amber who typed that Pinterest search at 11pm is in\
    \ research mode \u2014 she wants validation that this brand checks every box she's\
    \ been failing to find elsewhere. A '3 reasons this tee doesn't look churchy'\
    \ listicle maps directly onto her mental checklist and gives her permission to\
    \ convert by systematically resolving each objection."
  production_notes: "Avoid generic copy like 'high quality fabric' \u2014 each list\
    \ point must visually and verbally address the style-vs-faith tension (e.g. cut,\
    \ graphic design language, how it looks styled with jeans) to stay credible to\
    \ Amber's specific search intent."
- format_id: were-not-cheap
  name: We're Not Cheap (Objection Handling)
  summary: Direct objection handling. Lead hook is "We're not cheap and we don't want
    to be" followed by specific reasons (ingredients, supply chain, ethics, manufacturing).
    Classic objection-handling sales technique applied to creative.
  format_type: both
  production_complexity: low
  rank: 3
  rationale: "Amber is a values-driven shopper whose pain is about meaning and identity,\
    \ not just price \u2014 framing the product's worth around intentional design\
    \ choices (faith-forward but fashion-conscious) speaks directly to why this tee\
    \ costs more than a Spirit Halloween rack find. The objection-handling structure\
    \ converts her latent 'but is it worth it?' hesitation into confidence right at\
    \ the decision point."
  production_notes: "Anchor the 'not cheap' justification in design philosophy and\
    \ brand conviction rather than materials or supply chain \u2014 Amber cares that\
    \ someone thought carefully about making faith look beautiful, not about thread\
    \ count."
