trending_format_recommendations:
- format_id: david-and-goliath
  name: David & Goliath
  summary: Underdog brand vs giant industry/competitor. Calls out an enemy first (a
    specific competitor, a massive scam, or the broken status quo), then contrasts
    with your brand using core differentiators and the science of why you're better.
    Animations on the science boost retention.
  format_type: both
  production_complexity: medium
  rank: 1
  rationale: "The brief's core angle is explicitly adversarial toward an industry\
    \ status quo \u2014 faith apparel forces a false choice between 'Sunday version'\
    \ and 'real version.' David & Goliath is built exactly for this: call out the\
    \ broken category first, then position 'Loves Jesus + America, Too.' as the brand\
    \ that refuses that compromise. Amber is solution-aware and frustrated, making\
    \ the switcher/frustrated persona match tight."
  production_notes: Define the 'enemy' as the category norm (stiff sincerity vs. hollow
    humor), not a specific brand, to avoid legal risk and keep the message broadly
    relatable.
- format_id: obvious-ai-slop
  name: Obvious AI Slop
  summary: "Pixar-style animated characters being intentionally cringe (e.g. \"Hi\
    \ I'm Vitamin D3\", \"I'm your stinky coochie\"). Works precisely BECAUSE it's\
    \ obviously fake \u2014 bypasses the \"is this person real?\" skepticism that's\
    \ killing traditional UGC. The cartoonish framing travels well across demographics\
    \ because it sidesteps the trust question entirely \u2014 even buttoned-up, research-driven\
    \ buyers engage with it as entertainment first, then absorb the product claim\
    \ almost as a side effect. Strong evergreen pattern for any brand that needs to\
    \ break through scroll-fatigue."
  format_type: video
  production_complexity: medium
  rank: 2
  rationale: "Amber is meme-aware and scroll-fatigued, and the brief's tone already\
    \ carries irreverence \u2014 the whole joke is that this shirt holds two registers\
    \ at once. Obvious AI Slop lets the creative lean into that dual-register energy\
    \ visually (sincere character + absurd format), signaling to Amber that this brand\
    \ gets the joke without being empty."
  production_notes: "Keep the Pixar-style character visually tied to the American\
    \ faith aesthetic \u2014 flannel, flag, cross \u2014 so the cringe reads as self-aware\
    \ celebration, not mockery of her identity."
- format_id: were-not-cheap
  name: We're Not Cheap (Objection Handling)
  summary: Direct objection handling. Lead hook is "We're not cheap and we don't want
    to be" followed by specific reasons (ingredients, supply chain, ethics, manufacturing).
    Classic objection-handling sales technique applied to creative.
  format_type: both
  production_complexity: low
  rank: 3
  rationale: "Amber's pain point is that generic boutique tees are empty and faith\
    \ tees are stiff \u2014 implying she's already dismissed cheap options on both\
    \ ends. Objection handling that leads with 'we're not cheap' reframes the price\
    \ premium as intentional craftsmanship, speaking directly to a values-driven buyer\
    \ who wants quality to match conviction."
  production_notes: "Ground the 'not cheap' reasons in tangible product details \u2014\
    \ fabric weight, print durability, the specific phrase \u2014 rather than vague\
    \ brand values, or it risks sounding like every other boutique."
