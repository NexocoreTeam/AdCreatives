framework: fab
angle: "Why does faith apparel always make you choose \u2014 Sunday version or real\
  \ version? This phrase doesn't."
hook: "Most faith tees are designed for one version of you.\n\nThe Sunday version.\
  \ The version that has it together.\n\n*Loves Jesus + America, Too.* was written\
  \ for the one who also\nneeds a Diet Coke and a nap \u2014 and isn't apologizing\
  \ for either.\n\nThere's a reason it's the shirt that keeps selling out.\n"
hook_type: Curiosity Gap (Intrigue)
slot: 4
hook_source: "competitive-gap faith meets real-life mom humor \u2014 no competitor\
  \ holds irreverent plus faithful tone simultaneously"
hook_tactic: "Contrarian \u2014 challenge the assumption that you have to pick a lane,\
  \ then reveal the shirt as proof you don't"
persona: All-Of-It Amber
creative_mechanic: contrast_plus_aspirational_identity
visual_format: "Split-frame lifestyle static \u2014 left side shows a stiff, overtly\
  \ religious graphic tee in a sterile setting; right side shows the Loves Jesus +\
  \ America, Too. tee worn casually at a cookout or on a school run, same woman, completely\
  \ different energy"
visual_format_alternatives:
- "Reels-style video montage \u2014 quick cuts between 'Sunday version' moments and\
  \ 'real Tuesday' moments, tee present throughout, ending on a direct-camera smile"
- "Text-motion graphic \u2014 the phrase 'Loves Jesus + America, Too.' builds word\
  \ by word on screen over a warm lifestyle background, no people required"
persona_traits: "Millennial Christian mom who runs two internal tracks simultaneously\
  \ \u2014 the faith track and the 'feral' track \u2014 and is tired of apparel brands\
  \ that only see one of them"
pain_point: "Generic boutique tees are funny but empty; faith apparel is sincere but\
  \ stiff \u2014 she can't find one shirt that holds both registers at once"
benefit_callouts:
- One phrase. Both versions of you.
- Wry, warm, and zero apology
- "The brand's most iconic crossover \u2014 for a reason"
cta: Wear the whole you
