# SecondKind Bold — animated ads config
client: "SecondKind (Bold)"
slug: secondkind-bold

palette:
  background: "#fefcf6"          # warm snow-white
  neutrals: "#d2d2cd / #1c1917"  # light grey, charcoal/black
  accent: "#fcb348"              # marigold (single accent; lives within the microbiome dot cluster)
  notes: "Editorial minimalism, Kinfolk-meets-apothecary; clinical but warm; premium and restrained"
fonts:
  display: "F37 Caslon Condensed"
  body: "Neue Montreal"
product:
  name: "Gut Balance"
  appearance: "dark amber glass apothecary jar, glossy black lid, stone-grey papery label, product name in a condensed classic serif"
  signature_motif: "abstract white microbiome dot-cluster with a single marigold dot"

style: pixar
variant: talking-cast

voice:
  posture: "confrontational, declarative, science-armed, wry (not sneering)"
  arc: "name the suspicion she already had -> diagnose the mechanism -> vindicate her -> convert with the offer"
  always:
    - "lead with the mechanism failure (the ~70% transit-death stat)"
    - "back every claim with a receipt in the next line"
    - "the punch lands on the delivery model or the category, never the customer"
    - "vindicate: you weren't wrong, the product was"
    - "close with mechanism + offer; never lead with operational claims"
  never:
    - "frame as 'a better probiotic' (we reject the category)"
    - "name a competitor brand (Seed, Arrae, Ritual)"
    - "bash doctors (frame as 'literature ahead of practice')"
    - "scarcity, urgency, countdown timers"
    - "aesthetic/body framing for Natalie (sacred ground); allowed for Danielle only when blame lands on the mechanism"
prohibited_terms: [cure, treats, heals, prevents, reverses, eliminates, miracle, revolutionary,
  life-changing, game-changer, guaranteed, amazing, incredible, "transform your", journey, ritual]
typography_rules:
  - "sentence case only, no ALL CAPS"
  - "no em-dashes or en-dashes"
  - "F37 Caslon Condensed headlines, Neue Montreal body"

generation:
  image_model: nano_banana_pro
  video_model: kling
  aspect_ratio: "9:16"
  resolution: "2k"
  variations_per_still: 3

