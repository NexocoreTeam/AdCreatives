brief_id: secondkind-bold-gut-balance-536977
client: secondkind-bold
product: Gut Balance
awareness_level: problem_aware
framework: bab
angle: "The fog lifted and she almost missed it \u2014 a quiet return story from someone\
  \ who stopped expecting anything to work"
hook: "I didn't even realize my brain fog had lifted until my husband said something\
  \ at dinner and I actually tracked the whole conversation. Didn't lose the thread.\
  \ Didn't smile and nod. I was just \u2014 there. I'd been taking Gut Balance for\
  \ a few weeks at that point. I wasn't expecting anything. I'd already tried the\
  \ probiotics everyone recommends. Waited. Canceled. Told myself I was just tired\
  \ because I have a baby. But something had quietly shifted. My stomach wasn't doing\
  \ that tight, heavy thing by noon. I was going to the bathroom like a normal person\
  \ again. And apparently my brain came along for the ride. I just want to feel like\
  \ me again \u2014 I've been saying that for over a year. I think I'm starting to.\n"
hook_type: Story / Result (Empathy + Relief)
slot: 2
hook_source: avatar pain brain fog and gut irregularity postpartum plus desire to
  feel like herself again
hook_tactic: "Mid-story drop with a confession opener \u2014 start at the moment of\
  \ recognition ('I didn't even realize it had lifted'), not at the beginning of the\
  \ problem"
persona: New-Normal New Mom Natalie
creative_mechanic: micro_story_plus_suspense
visual_format: "UGC video \u2014 phone-shot, natural home setting, mom speaking directly\
  \ to camera in a low-key conversational tone, no script energy, feels like a voice\
  \ note she almost didn't send"
visual_format_alternatives:
- "Carousel static \u2014 first card opens with the fog-lifting line in large text,\
  \ subsequent cards show the specific shifts (digestion, energy, presence), final\
  \ card shows product with a single clean CTA"
- "Scripted narrative video with b-roll \u2014 short-form with no talking head, just\
  \ hands making coffee, morning light, a journal, soft ambient sound, text overlays\
  \ carrying the story beats"
persona_traits: "Postpartum mom who has stopped expecting supplements to work, describes\
  \ her body as 'still off,' and would never lead with excitement \u2014 she'd lead\
  \ with cautious, almost reluctant relief"
pain_point: Brain fog and low energy attributed partly to sleep deprivation but suspected
  to be something deeper, alongside persistent postpartum bloating
benefit_callouts:
- Digestive calm without the disruption phase
- "Gut-brain axis support \u2014 the connection is real"
- Feel it in weeks, not someday
cta: "Read how it works \u2014 then decide"
