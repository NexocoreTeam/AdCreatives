trending_format_recommendations:
- format_id: david-and-goliath
  name: David & Goliath
  summary: Underdog brand vs giant industry/competitor. Calls out an enemy first (a
    specific competitor, a massive scam, or the broken status quo), then contrasts
    with your brand using core differentiators and the science of why you're better.
    Animations on the science boost retention.
  format_type: both
  production_complexity: medium
  rank: 1
  rationale: "Brandon is a problem-aware biohacker who has already tried solutions\
    \ that stopped working \u2014 the David & Goliath format lets the ad name the\
    \ enemy explicitly (the wrong tools: probiotics, adaptogens, whatever he cycled\
    \ through) before positioning Gut Balance as the explanation he's been missing.\
    \ The 'plateau story' angle maps perfectly onto the 'broken status quo' variant\
    \ of this format, giving his frustration a villain and a resolution."
  production_notes: The 'enemy' named must be a category or mechanism (e.g. single-strain
    probiotics, stimulant-based energy fixes) rather than a competitor brand to avoid
    legal risk and keep Brandon's identity feeling validated rather than attacked.
- format_id: tiktok-love-letter
  name: TikTok Love Letter
  summary: 'Long text overlay on a short, low-lift video. Calls out the target audience
    directly ("Listen, girls", "Hot girls", "POV: you"). Borrows vernacular from viral
    TikTok comments. Creator content or iPhone B-roll. The text monologue is the hero.'
  format_type: video
  production_complexity: low
  rank: 2
  rationale: "The hook is already written as an intimate, first-person confession\
    \ \u2014 the Love Letter format is architecturally identical, using long text\
    \ overlay as the hero to mirror Brandon's internal monologue about the plateau.\
    \ A problem-aware persona who suspects a gut origin but lacks a clear explanation\
    \ will stay with slow, empathetic text that finally names the pattern."
  production_notes: "B-roll should feel like Brandon's world \u2014 supplement shelves,\
    \ morning routines, afternoon slumps at a laptop \u2014 not generic wellness stock\
    \ footage, or the intimacy of the monologue collapses."
- format_id: obvious-ai-slop
  name: Obvious AI Slop
  summary: "Pixar-style animated characters being intentionally cringe (e.g. \"Hi\
    \ I'm Vitamin D3\", \"I'm your stinky coochie\"). Works precisely BECAUSE it's\
    \ obviously fake \u2014 bypasses the \"is this person real?\" skepticism that's\
    \ killing traditional UGC. The cartoonish framing travels well across demographics\
    \ because it sidesteps the trust question entirely \u2014 even buttoned-up, research-driven\
    \ buyers engage with it as entertainment first, then absorb the product claim\
    \ almost as a side effect. Strong evergreen pattern for any brand that needs to\
    \ break through scroll-fatigue."
  format_type: video
  production_complexity: medium
  rank: 3
  rationale: "Brandon as a biohacker researcher is inherently skeptical of traditional\
    \ UGC and testimonials, making the disarming self-awareness of Obvious AI Slop\
    \ a useful trust bypass \u2014 a character like 'Hi, I'm your gut lining' explaining\
    \ the plateau mechanism could land the science angle with levity. This format\
    \ also extends reach into meme-aware wellness communities where Brandon likely\
    \ spends time."
  production_notes: The science embedded in the character's dialogue must be accurate
    and specific (e.g. microbiome adaptation, receptor downregulation) or the joke
    format will undermine credibility with a researcher persona who will fact-check
    the claims.
