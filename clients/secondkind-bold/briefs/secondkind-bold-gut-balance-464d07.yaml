brief_id: secondkind-bold-gut-balance-464d07
client: secondkind-bold
product: Gut Balance
awareness_level: problem_aware
framework: bab
angle: "A before/after arc that mirrors her exact internal monologue \u2014 faithful\
  \ probiotic use, honest self-assessment, no results \u2014 then introduces postbiotics\
  \ not as a product upgrade but as the answer to a question she has been asking for\
  \ two years"
hook: 'She took her probiotic every morning for two years.

  Refrigerated. Expensive. Forty-eight strains.

  Tracked her bloating. Tracked her energy. Tracked her digestion.

  Nothing moved.


  She wasn''t doing it wrong. The bacteria just weren''t surviving the trip.


  Her gut didn''t need more bacteria.

  It needed what the bacteria were supposed to make.

  '
hook_type: Story / Result (Empathy + Relief)
slot: 2
hook_source: avatar quote two years same gut plus competitive-gap probiotic long-term
  plateau
hook_tactic: "Storytelling \u2014 drop mid-moment into the lived experience of probiotic\
  \ disappointment, then let the mechanism explain the turn"
persona: Perimenopause Paula
creative_mechanic: micro_story_plus_suspense
visual_format: "Split-screen static \u2014 left panel shows an open probiotic bottle\
  \ with a calendar marked off (two years of effort); right panel is intentionally\
  \ sparse, just the mechanism line in clean type: 'Her gut needed what the bacteria\
  \ were supposed to make.'"
visual_format_alternatives:
- "UGC-style video monologue \u2014 a real woman, no brand polish, speaking directly\
  \ to camera about recognizing herself in that story, ending on the mechanism reframe"
- "Long-form carousel \u2014 each card carries one beat of the story (the routine,\
  \ the tracking, the nothing, the explanation, the pivot), designed to be read slowly\
  \ by someone who recognizes every frame"
persona_traits: "Methodical, self-aware woman 42\u201354 who approached gut health\
  \ like a project, did everything right by the category's own standards, and is privately\
  \ furious that it didn't work"
pain_point: "Persistent bloating and digestive irregularity unresolved after sustained,\
  \ high-quality probiotic use \u2014 quiet exhaustion of trying correctly and still\
  \ failing"
benefit_callouts:
- 'Postbiotics: the output your gut was waiting for'
- 84-day clinical study. Real outcomes, not rounding errors.
- Shelf-stable. No cold chain. No dying on the shelf.
cta: "Find out what your gut was actually missing \u2014 start here"
body_copy: ''
visual_direction: "Quiet, precise, slightly melancholy in the before \u2014 not dramatic\
  \ suffering, just the quiet tedium of trying faithfully and getting nowhere. The\
  \ turn should feel like relief, not celebration. Muted palette. The mechanism line\
  \ should land like a diagnosis, not a sales pitch."
tone_override: ''
target_platform: meta
source_insight: angle_multiplier
campaign_name: ''
