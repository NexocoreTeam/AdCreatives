  name: TikTok Short / POV
  summary: '(Updated 2026-06-11) 1-2 line meme-native identity flex or POV over a candid
    clip of a real person in a mundane moment. Messaging test bed; winners graduate.
    Spec: trending_formats.yaml; line bank: clients/secondkind-bold/copy/tiktok-pov-shorts.md.'
  format_type: video
  production_complexity: low
  rank: 3
  rationale: 'A single POV line like ''POV: you did everything right and your gut
