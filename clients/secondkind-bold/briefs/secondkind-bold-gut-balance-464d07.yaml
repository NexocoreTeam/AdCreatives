- format_id: david-and-goliath
  name: David & Goliath
  summary: Underdog brand vs giant industry/competitor. Calls out an enemy first (a
    specific competitor, a massive scam, or the broken status quo), then contrasts
    with your brand using core differentiators and the science of why you're better.
    Animations on the science boost retention.
  format_type: both
  production_complexity: medium
  rank: 2
  rationale: "Paula has already invested heavily in the probiotic category and gotten\
    \ nothing \u2014 framing probiotics as the broken status quo (the Goliath) and\
    \ postbiotics as the overlooked answer she never knew to ask for speaks directly\
    \ to her frustration with a system she trusted. This format gives her intellectual\
    \ permission to switch without feeling foolish for her past choices."
  production_notes: "Be careful not to attack probiotic brands by name or make her\
    \ feel stupid for using them \u2014 the enemy is the category gap and incomplete\
    \ science, not her past decisions."
