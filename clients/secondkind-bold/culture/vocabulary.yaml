# Living lexicon for SecondKind Bold. Layer 3 artifact.
# Rules:
#   - Every entry has added / expires / confidence / source. No undated entries.
#   - Entries auto-expire: do not use past `expires` unless re-observed (then bump dates).
#   - Surface tiers: T1 comments, T2 organic, T3 paid organic-style, T4 paid hooks/statics.
#   - This file wins register conflicts on T1-T2. It never overrides Layer 0 (legal) or Layer 1 (identity).
# Maintained by the culture-pulse skill. Manual adds welcome: copy an entry shape.

meta:
  client: secondkind-bold
  updated: 2026-06-10
  default_ttl_days: 60
  review_cadence: biweekly

constructions:  # sentence shapes; durable, borrow freely
  - phrase: "this is a love letter to [the girls who...]"
    use: opener callout, T2-T3
    confidence: high
    source: love-letter format native phrasing, validated in repo worked example
    added: 2026-06-10
    expires: 2026-10-10
  - phrase: "POV: [scenario]"
    use: short-form opener, T2
    confidence: high
    source: trending format library (tiktok-short-pov), still live
    added: 2026-06-10
    expires: 2026-10-10
  - phrase: "be honest: [confession question]"
    use: comment-bait captions, T1-T2 only (questions banned on T4)
    confidence: medium
    source: comment-density mechanics research 2026-06
    added: 2026-06-10
    expires: 2026-08-10
  - phrase: "the math isn't mathing"
    use: receipts register bridge ("you did the math on your probiotic. it wasn't mathing.") T1-T2
    confidence: medium
    source: durable millennial/gen-z phrase; fits brand's "here's the math" doctrine
    added: 2026-06-10
    expires: 2026-08-10
  - phrase: "you know the one"
    use: knowing-fragment punch line after a specific detail, T1-T3
    confidence: high
    source: group-chat register, repo love letters
    added: 2026-06-10
    expires: 2026-12-10
  - phrase: "nobody talks about [the specific thing]"
    use: confession opener, T2; pairs with unspoken-truths bank
    confidence: high
    source: guttok confession-content convention
    added: 2026-06-10
    expires: 2026-10-10

