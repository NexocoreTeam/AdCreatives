do_not_borrow:  # culture that exists but is wrong for a 28-50 buyer or for us
  - phrase: "skibidi / brainrot vocabulary"
    why: gen-alpha register; reads as costume on a 28-50 brand
  - phrase: "delulu"
    why: expiring + teen-coded; specificity beats slang for this buyer
  - phrase: mainstream trend sounds older than 48h
    why: a third of users find late brand trend-jumping embarrassing; brat-summer lesson
  - phrase: sincere wellness-speak (journey, healing era, gut reset)
    why: Layer 2 ban holds; ironic quotation only
