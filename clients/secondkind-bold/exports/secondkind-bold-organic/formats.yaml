# Organic Formats Catalog
# 80 organic content frames from Sarah Levinger's TV-show-style framework.
#
# Scope: ORGANIC ONLY. Paid ad formats (Dara Denny's 8) are handled by the
# creative-matrix pipeline, NOT here. Do not add paid-execution formats to
# this file.
#
# Schema per entry:
# id kebab-case unique identifier
# name display name
# category one of 8: game-competition, mystery-investigation, comedy-sitcom,
# interview-talk-show, educational-how-to, reality-social-experiment,
# lifestyle-documentary, character-story-driven
# source sarah_levinger (sole source for now)
# description one-line description of the format
# funnel_stages list of: trigger, exploration, consideration
# (Levinger's organic axis. Purchase is paid-only and lives outside this skill.)
# production_lift low | medium | high
# episodic is this a recurring-series format?
# cast_required does this need recurring on-screen characters?
# notes optional execution caveats

formats:

 # ==========================================================================
 # GAME & COMPETITION SHOWS (10 formats)
 # ==========================================================================

 - id: price-is-right
 name: Price is Right
 category: game-competition
 source: sarah_levinger
 description: Guess the value of things in your niche. Host asks, audience plays.
 funnel_stages: [trigger, exploration]
 production_lift: low
 episodic: true
 cast_required: false
 notes: Works best when price perception in the niche is non-obvious.

