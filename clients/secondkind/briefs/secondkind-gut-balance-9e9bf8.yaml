trending_format_recommendations:
- format_id: tiktok-love-letter
  name: TikTok Love Letter
  summary: 'Long text overlay on a short, low-lift video. Calls out the target audience
    directly ("Listen, girls", "Hot girls", "POV: you"). Borrows vernacular from viral
    TikTok comments. Creator content or iPhone B-roll. The text monologue is the hero.'
  format_type: video
  production_complexity: low
  rank: 1
  rationale: "Natalie is a millennial new mom who is problem-aware but emotionally\
    \ exhausted \u2014 the Love Letter format's direct community call-out ('Listen,\
    \ mamas') and text-monologue structure mirrors the internal voice she's already\
    \ having about her unresolved bloating and fog, making the PAS framework feel\
    \ personal rather than salesy. The hook stat about serotonin production drops\
    \ naturally into a long text overlay without requiring heavy production, keeping\
    \ the tone raw and relatable."
  production_notes: "The text overlay must do the heavy lifting \u2014 keep B-roll\
    \ footage grounded in recognizable postpartum domestic moments (kitchen, mirror,\
    \ tired morning routines) so Natalie sees herself, not a lifestyle fantasy."
- format_id: tiktok-short-pov
  name: TikTok Short / POV
  summary: Shorter cousin of the Love Letter. One or two lines of POV text on top
    of B-roll. Fastest format to test. Borrows directly from what's trending in the
    operator's own reels feed at time of creation.
  format_type: video
  production_complexity: low
  rank: 2
  rationale: "The hook \u2014 'Six months postpartum. Still bloated. Still foggy.'\
    \ \u2014 is already written in POV format, making this a near-perfect structural\
    \ match for Natalie's scroll-fatigued, time-poor mindset where two lines of text\
    \ on relatable B-roll can stop the thumb cold. Because she is problem-aware, the\
    \ gut-punch of the stat in a single overlay can agitate the pain efficiently before\
    \ the CTA without requiring her to commit to longer content."
  production_notes: "Keep it to one or two text cards maximum \u2014 resist the temptation\
    \ to overload with information, as the format's power lives entirely in its restraint\
    \ and the visual authenticity of the B-roll chosen."
- format_id: obvious-ai-slop
  name: Obvious AI Slop
  summary: "Pixar-style animated characters being intentionally cringe (e.g. \"Hi\
    \ I'm Vitamin D3\", \"I'm your stinky coochie\"). Works precisely BECAUSE it's\
    \ obviously fake \u2014 bypasses the \"is this person real?\" skepticism that's\
    \ killing traditional UGC. The cartoonish framing travels well across demographics\
    \ because it sidesteps the trust question entirely \u2014 even buttoned-up, research-driven\
    \ buyers engage with it as entertainment first, then absorb the product claim\
    \ almost as a side effect. Strong evergreen pattern for any brand that needs to\
    \ break through scroll-fatigue."
  format_type: video
  production_complexity: medium
  rank: 3
  rationale: "Natalie's postpartum brain fog and probiotic plateau frustration involve\
    \ a credibility gap \u2014 she's tried things and been disappointed \u2014 and\
    \ the intentionally-fake animated format disarms that skepticism by leaning into\
    \ absurdity, letting a character like 'Hi, I'm your gut bacteria' deliver the\
    \ 91% serotonin stat without triggering her 'another sponsored post' radar. The\
    \ wellness and supplement persona match is strong, and the format can carry the\
    \ PAS angle with humor while still landing a serious payoff."
  production_notes: "The cringe tone must stay controlled enough that the serotonin-gut\
    \ science stat still lands as genuinely credible \u2014 use the animation for\
    \ personality and delivery, but treat the stat itself with visual emphasis so\
    \ it registers as a real data point, not a joke."
