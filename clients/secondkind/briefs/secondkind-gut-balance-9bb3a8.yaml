- format_id: obvious-ai-slop
  name: Obvious AI Slop
  summary: "Pixar-style animated characters being intentionally cringe (e.g. \"Hi\
    \ I'm Vitamin D3\", \"I'm your stinky coochie\"). Works precisely BECAUSE it's\
    \ obviously fake \u2014 bypasses the \"is this person real?\" skepticism that's\
    \ killing traditional UGC. The cartoonish framing travels well across demographics\
    \ because it sidesteps the trust question entirely \u2014 even buttoned-up, research-driven\
    \ buyers engage with it as entertainment first, then absorb the product claim\
    \ almost as a side effect. Strong evergreen pattern for any brand that needs to\
    \ break through scroll-fatigue."
  format_type: video
  production_complexity: medium
  rank: 3
  rationale: "A visibly animated probiotic bacterium dramatically 'dying' before reaching\
    \ the gut turns the 99% die-off stat into a visual gag that bypasses Danielle's\
    \ well-developed UGC skepticism \u2014 she has seen every real-person testimonial\
    \ format and tuned it out. The intentional artificiality signals this isn't another\
    \ influencer shill, which earns a few extra seconds of attention from a scroll-fatigued,\
    \ multi-brand veteran."
  production_notes: "The cringe tone must stay calibrated \u2014 lean into the absurdity\
    \ of the dying bacteria visuals but keep the core stat (99% die before reaching\
    \ your gut) delivered straight, otherwise the humor undercuts the credibility\
    \ of the science claim."
