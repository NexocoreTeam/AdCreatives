    \ too early, Danielle's skepticism wall goes up immediately."
- format_id: tiktok-love-letter
  name: TikTok Love Letter
  summary: '(Updated 2026-06-11) Short, warm, educational direct-address piece. 35-75
    words, 3 beats. Callout + hedged surprising fact, then emoji-led supports lines, then
    product named once + effortless close. Spec: trending_formats.yaml; worked scripts:
    clients/secondkind-bold/copy/tiktok-love-letters-v3.md.'
  format_type: video
  production_complexity: low
  rank: 2
  rationale: "Danielle's pain is deeply personal and identity-adjacent \u2014 she\
    \ did everything 'right' and still feels nothing, which creates shame and fatigue\
    \ that a direct-address love letter format ('Listen, girls who've tried every\
    \ probiotic on the shelf') can weaponize as empathy before delivering the stat.\
