trending_format_recommendations:
- format_id: david-and-goliath
  name: David & Goliath
  summary: Underdog brand vs giant industry/competitor. Calls out an enemy first (a
    specific competitor, a massive scam, or the broken status quo), then contrasts
    with your brand using core differentiators and the science of why you're better.
    Animations on the science boost retention.
  format_type: both
  production_complexity: medium
  rank: 1
  rationale: "Danielle is a frustrated 'Done-Everything' buyer who has already spent\
    \ real money on multiple probiotic brands \u2014 she is primed for a format that\
    \ names the industry-wide scam (probiotics dying before reaching the gut) as the\
    \ enemy rather than any single brand. The PAS framework maps perfectly onto the\
    \ David & Goliath structure: the 99% die-off stat is the Goliath, Gut Balance's\
    \ survivability is the David."
  production_notes: "Lead with the enemy (the probiotic industry's delivery failure)\
