  \ The stat '1 trillion bioactive compounds per serving' is set in confident, readable\
  \ type directly over or beside the product. The overall feeling should be: a brand\
  \ that is certain enough in its ingredients that it does not need to dress them\
  \ up.\n"
tone_override: ''
target_platform: meta
source_insight: angle_multiplier
campaign_name: ''
trending_format_recommendations:
- format_id: david-and-goliath
  name: David & Goliath
  summary: Underdog brand vs giant industry/competitor. Calls out an enemy first (a
    specific competitor, a massive scam, or the broken status quo), then contrasts
    with your brand using core differentiators and the science of why you're better.
    Animations on the science boost retention.
  format_type: both
  production_complexity: medium
  rank: 1
  rationale: "Natalie has already tried probiotics and is frustrated they didn't fully\
    \ resolve her postpartum bloating \u2014 making her the textbook 'switcher' and\
    \ 'frustrated' persona this format is built for. The angle of '1 trillion already-active\
    \ bioactive compounds vs. bacteria that may never survive digestion' is a perfect\
    \ David vs. Goliath contrast: the broken status quo of traditional probiotics\
    \ is the Goliath, and Gut Balance wins on the specific scientific differentiator\
    \ she's been missing."
  production_notes: "The science contrast must be visually clear and jargon-free \u2014\
    \ use a simple side-by-side or animated explainer showing 'bacteria hoping to\
    \ survive' vs. 'already active compounds arriving ready,' or Natalie's skepticism\
    \ will deepen rather than dissolve."
- format_id: tiktok-love-letter
  name: TikTok Love Letter
  summary: '(Updated 2026-06-11) Short, warm, educational direct-address piece. 35-75
    words, 3 beats. Callout + hedged surprising fact, then emoji-led supports lines, then
    product named once + effortless close. Spec: trending_formats.yaml; worked scripts:
    clients/secondkind-bold/copy/tiktok-love-letters-v3.md.'
  format_type: video
  production_complexity: low
  rank: 2
  rationale: "Natalie is problem-aware and emotionally loaded \u2014 she's been silently\
    \ second-guessing herself since pregnancy, which is exactly the identity-and-community\
    \ wound a Love Letter format addresses with a direct callout like 'POV: you've\
    \ tried every probiotic and your gut still isn't right after baby.' The long text\
    \ overlay lets the hook stat (1 trillion bioactive compounds) land with full PAS\
    \ momentum before she scrolls away."
  production_notes: "The text monologue must mirror Natalie's internal voice precisely\
    \ \u2014 avoid clinical language and lean into the exhaustion and quiet shame\
    \ of 'I've already tried everything,' otherwise the format's intimacy advantage\
    \ is wasted."
- format_id: listicle
  name: Listicle
  summary: Classic "3 reasons why" / numbered format. Same script distributed across
    multiple creators with distinct personas. Often paired with negative marketing
    ("3 reasons NOT to buy X" or "3 things I wish I knew"). Bottom-of-barrel creatively
    but reliably saves campaigns.
  format_type: video
  production_complexity: low
  rank: 3
  rationale: Natalie is a researcher-type who has already investigated probiotics,
    meaning she'll respond to a structured '3 reasons your probiotics aren't working
    postpartum' framing that methodically validates her suspicion before introducing
    Gut Balance's bioactive compound differentiation. The negative hook ('3 reasons
    NOT to trust your probiotic') also aligns tightly with the PAS framework and her
    existing skepticism.
  production_notes: "Each numbered point must build toward the bioactive compound\
    \ angle as the logical payoff \u2014 avoid generic gut health claims or Natalie,\
    \ who has heard them all before, will dismiss the ad before reaching the product\
    \ reveal."
