trending_format_recommendations:
- format_id: were-not-cheap
  name: We're Not Cheap (Objection Handling)
  summary: Direct objection handling. Lead hook is "We're not cheap and we don't want
    to be" followed by specific reasons (ingredients, supply chain, ethics, manufacturing).
    Classic objection-handling sales technique applied to creative.
  format_type: both
  production_complexity: low
  rank: 1
  rationale: "Paul is solution_aware and already convinced on mechanism \u2014 his\
    \ final barrier is price-to-certainty ROI, the '$50/month and felt nothing' churn\
    \ pattern. This format directly confronts that objection head-on by validating\
    \ the premium price with the 1 trillion bioactive compounds stat and the no-return-needed\
    \ 60-day guarantee as the risk-removal close, which is exactly the FAB structure\
    \ the brief demands."
  production_notes: "The hook must lead with the price objection verbatim before pivoting\
    \ to the features \u2014 if the benefit payoff arrives before the objection is\
    \ named, Paul will tune out before the risk-removal guarantee lands."
- format_id: david-and-goliath
  name: David & Goliath
  summary: Underdog brand vs giant industry/competitor. Calls out an enemy first (a
    specific competitor, a massive scam, or the broken status quo), then contrasts
    with your brand using core differentiators and the science of why you're better.
    Animations on the science boost retention.
  format_type: both
  production_complexity: medium
  rank: 2
  rationale: "A practitioner persona like Paul respects mechanism and evidence, making\
    \ the 'broken status quo' enemy angle \u2014 surviving-culture supplements that\
    \ can't guarantee delivery \u2014 a credible villain; contrasting with direct\
    \ bioactive delivery and clinical scale (1 trillion compounds) lets the FAB framework\
    \ shine without feeling like a sales pitch."
  production_notes: "Avoid vague competitor callouts \u2014 name the specific failure\
    \ mode (colony-count marketing, survival-rate variance) rather than a named brand\
    \ to keep clinical credibility intact and stay compliant."
- format_id: listicle
  name: Listicle
  summary: Classic "3 reasons why" / numbered format. Same script distributed across
    multiple creators with distinct personas. Often paired with negative marketing
    ("3 reasons NOT to buy X" or "3 things I wish I knew"). Bottom-of-barrel creatively
    but reliably saves campaigns.
  format_type: video
  production_complexity: low
  rank: 3
  rationale: The FAB framework maps cleanly onto a '3 reasons practitioners are switching
    to Gut Balance' listicle structure, giving Paul the methodical, scannable evidence
    he needs to justify the premium purchase to himself; the surprising stat hook
    on 1 trillion compounds works naturally as the opening list item that reframes
    what direct delivery actually means.
  production_notes: "Each list point must carry a concrete proof signal \u2014 a compound\
    \ count, a clinical reference, or the guarantee detail \u2014 because Paul will\
    \ disengage immediately if any numbered item reads as marketing fluff without\
    \ a functional payoff."
