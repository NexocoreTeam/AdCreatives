    summary: Arrae built genuine traction on the back of its hero Bloat capsule —
      a clean, aesthetically differentiated product that delivers real relief for
      a vocal audience of bloat and IBS sufferers — but the brand's expansion into
      weight loss (MB-1, Tone) and broader wellness SKUs has exposed deep credibility
      and operational gaps. Across every Trustpilot region (1.8–2.9 stars, 150+ reviews),
      the dominant complaints are a manipulative subscription model, an effectively
      non-existent refund process, dismissive customer service, and a pattern of adverse
      reactions (migraines, nausea, jitteriness) with no recourse — creating a class
      of vocal, permanently churned customers who actively warn others. The brand's
      aspirational "millennial wellness" positioning and influencer reach are increasingly
      at war with its operating reality, making it a strong switching opportunity
      for any competitor that can credibly own transparent dosing, clean side-effect
      profiles, and genuinely frictionless customer experience.
