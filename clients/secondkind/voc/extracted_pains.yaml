language_patterns:
- 'Emotional amplification through repetition and spelling: ''neeeee,'' ''yesss,''
  ''gooooo,'' ''AMAZING,'' ''FANTASTIC'''
- "Heavy emoji use as emotional shorthand \u2014 love, fire, applause, and heart emojis\
  \ dominate positive sentiment"
- 'Medical/functional language appears only when genuinely frustrated: ''murderous
  hot night flashes,'' ''water retention,'' ''breastfeeding'''
- 'Clinical credibility is expressed as a values statement, not a feature: ''Clinically
  backed is the future,'' ''We deserve proof'''
- "Urgency language without context: 'I need this bad,' 'I need these,' 'Immediately\
  \ yes' \u2014 desire without articulated reason"
- Community tagging behavior suggests social sharing intent is high but content depth
  is low
- "Gut-skin connection mentioned naturally and unprompted \u2014 treated as assumed\
  \ common knowledge"
- "Subscription friction expressed as a direct support question, not a complaint \u2014\
  \ suggests confusion rather than hostility"
- Customer service frustration is the most emotionally detailed and longest-form negative
  content in the set
- "Casual, TikTok-native register \u2014 informal, fast, emoji-heavy, sentence fragments"
- Self-deprecating humor used to normalize digestive complaints (bloating, constipation)
- 'Strong parasocial trust language directed at creators: ''I trust you with my life,''
  ''ty queen'''
- 'Skepticism expressed bluntly and publicly with no softening: ''false advertising,''
  ''sneaky LIE'''
- 'Outcome language is specific and physical: ''3 pm slump,'' ''shaky and weak,''
  ''feel gross,'' ''bloated and constipated'''
- 'Product curiosity expressed as desire loops: ''I need to try,'' ''interested in...
  next,'' ''would love to hear'''
- 'Month-tracking indicates buyers are measuring time-to-result: ''month 3,'' ''day
  two,'' ''a few days ago'''
- Price sensitivity surfaced indirectly through validation-seeking, not direct complaint
- Both reviews use casual, enthusiastic social media vernacular (emoji, 'yall', 'BTS')
  consistent with YouTube comment sections rather than product review platforms
- "Neither review references a product, ingredient, health outcome, or purchase \u2014\
  \ zero signal for gut health positioning or VOC mining"
