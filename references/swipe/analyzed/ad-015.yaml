  proof_element: casual confession that product was used one hour before flattering photo was taken
  product_role: reveal
  awareness_stage: solution_aware
  why_it_works: The DM format makes the product recommendation feel like an accidentally overheard friend
    secret rather than an ad — the social witness compliment creates the problem ('how?') and the confession
    instantly resolves it with the product name.
  cultural_note: Mimics native Instagram/iMessage DM UI — the purple reply bubbles signal the 'sender'
    perspective, creating parasocial intimacy and the illusion of a real private exchange between friends.
  steal: Use the overheard-DM structure where a flattering third-party compliment forces the 'secret'
    product reveal, embedding the product name organically in the final reply bubble rather than a headline.
  avoid: Do not reuse the creator, exact copy lines ('girl how do you ALWAYS look like that'), the specific
    username, or the bikini photo of this individual.
