    product_role: high
  reasoning:
    mechanic: The entire ad is framed as a private DM conversation the viewer is not supposed to see —
      the product is never advertised directly but emerges naturally as the answer to a friend's compliment,
      which is textbook Overheard Conversation.
    awareness_stage: The ad targets someone who knows debloating supplements exist but hasn't committed
      to Arrae — the 'viral bloat capsules' phrasing assumes category familiarity while positioning Arrae
      as the specific hero solution.
