  cultural_note: Mimics iPhone lock screen notification UI — borrows the psychological intimacy and authority
    of your own phone reminding you to do something, collapsing the distance between brand and self-talk.
  steal: Use the iOS lock screen / reminder notification format to deliver a key USP or price anchor as
    if it were the viewer's own internal reminder, pairing it with a casual product usage shot to naturalise
    the habit.
