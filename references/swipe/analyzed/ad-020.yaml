  why_it_works: It hijacks existing GLP-1 (Ozempic/Wegovy) cultural momentum — a topic millions of men
    are actively researching — and reframes a known side effect (muscle/testosterone loss) as the problem
    Mars Men solves, making the product feel necessary rather than optional.
  cultural_note: Piggybacks on the GLP-1/Ozempic cultural zeitgeist; the 'GLP-1 face' concern (premature
    aging, muscle wasting) is a widely discussed side effect in men's health communities, making this
    contrast immediately legible to the target audience.
  steal: Use the 'same scenario, with vs. without our product' contrast structure anchored to a trending
    cultural health topic the audience is already anxious about, letting the visual gap do the persuasion
    without editorial commentary.
  avoid: Do not reuse the AI-illustrated faces, the exact copy lines, the CHRONICLE10 code, or the Mars
    Men visual identity.
