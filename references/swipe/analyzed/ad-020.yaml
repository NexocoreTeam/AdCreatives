    awareness_stage: high
    product_role: high
  reasoning:
    mechanic: The two AI-illustrated faces are shown side by side with minimal editorial text — the visual
      contrast between the tired, puffy face and the sharp, healthy face does all the persuasion without
      the ad ever saying 'our product is better'; the audience draws that conclusion themselves.
    awareness_stage: The ad assumes the viewer already knows what GLP-1 drugs are and is either using
      them or considering them — it does not explain GLP-1 at all, only positions Mars Men as the necessary
      co-solution, indicating a solution-aware audience who knows treatments exist but hasn't yet adopted
      this specific supplement.
