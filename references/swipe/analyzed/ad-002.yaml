analysis:
  format: Listicle
  hook_type: Question
  mechanic: The Reframe
  secondary_mechanic: The Contrast Without Comment
  scan_path:
  - headline question
  - four nutrient comparison rows
  - price anchor CTA
  - product/person
  proof_element: specific food benchmarks — 5 eggs, banana, two tins of sardines, small orange — make
    nutrition claims feel concrete and testable
  product_role: prop
  awareness_stage: solution_aware
  why_it_works: Anchoring each nutrient to a familiar whole food (eggs, banana, sardines, orange) converts
    abstract label claims into tangible, lived-experience comparisons the viewer can immediately verify
    against their own kitchen.
  cultural_note: New Year resolution framing ('this year') taps seasonal health intent moment; fitness
    influencer aesthetic with neck tattoos signals aspirational-but-accessible identity rather than elite
    athlete
  steal: Use the 'more X than [familiar whole food]' structure to translate any supplement or nutrition
    product's label data into relatable, benchmarked proof rows with matching food icons.
  avoid: Do not reuse this specific creator or his exact copy lines; do not replicate Huel's brand bottle,
    logo, or color identity.
  proxy_signal: running ~43 months (since 2022-12-21), no longer live
  field_confidence:
    format: high
    hook_type: high
    mechanic: high
    awareness_stage: med
    product_role: high
  reasoning:
    mechanic: The ad opens by validating the viewer's existing goal ('eating healthier') then reframes
      the solution — rather than assembling multiple whole foods, one Huel shake outperforms each of them
      individually, pivoting the viewer's mental model from effort to convenience.
    awareness_stage: The viewer already knows meal replacement shakes exist and likely has a competing
      product in mind; the nutrient-vs-whole-food benchmarking and price anchor are persuasion moves aimed
      at someone comparing solutions, not discovering a problem.
