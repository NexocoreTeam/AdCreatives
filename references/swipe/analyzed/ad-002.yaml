  why_it_works: The word 'respectfully' mimics a Gen-Z softened callout tone, making the dismissal of
    competitor protein feel culturally fluent and non-aggressive, while the ingredient list reframes the
    switch as obvious self-upgrade rather than a sales pitch.
  cultural_note: '''Respectfully'' is a widely used Gen-Z/millennial hedge that signals polite but firm
    judgment — borrowing this tone makes the copy read as peer advice rather than advertising.'
  steal: Use the 'respectfully, X isn't enough anymore' contrarian hook structure to position any upgraded
    product against a generic category incumbent, layering specific ingredient or feature callouts as
    the reframe payload.
  avoid: Do not reuse the creator, her likeness, the exact copy line 'respectfully, basic protein isn't
    enough anymore', or Free Soul's brand visual identity including color palette and shaker design.
